<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuajo</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12352a">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuajo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a card table seen from above. Your partner sits across the top, the two opponents on
   the left and right, the stock / discard / sowee in the middle, and your own hand fanned along
   the bottom edge. One committed look: dark felt, ivory cards, gold accents (coins). */
:root {
  --felt: #1f4d40;
  --felt-deep: #12352a;
  --ivory: #f7f0df;
  --ivory-2: #e8dcc0;
  --ink: #2b2219;
  --fg: #f1eadb;
  --fg-dim: #c4b99f;
  --panel: #1a2925;
  --panel-2: #26382f;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #e2b04f;
  --accent-ink: #2a1c05;
  --good: #8fd39a;
  --warn: #f0a35e;
  --bad: #e5736d;
  --oros: #b07f1a;
  --copas: #b32f2e;
  --espadas: #3a5a8c;
  --bastos: #4c7a35;
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', Verdana, sans-serif;
  --size: 1;
  --cw: calc(clamp(46px, 5.6vw, 74px) * var(--size));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 35%, var(--felt) 0%, var(--felt-deep) 78%) no-repeat, var(--felt-deep);
  color: var(--fg);
  font: 400 16px/1.4 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
#app { min-height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 10px; max-width: 1360px; margin: 0 auto; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font: 700 clamp(22px, 3vw, 30px)/1 var(--font-display); letter-spacing: 0.08em; margin: 0; color: var(--accent); }
.brand .sub { color: var(--fg-dim); font-size: 14px; }
.topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.scores { display: flex; gap: 6px 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: 14px; }
.sc { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; background: rgba(0, 0, 0, 0.25); }
.sc .nm { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.us { background: var(--accent); }
.dot.them { background: var(--copas); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* buttons */
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; font-weight: 600; font-size: 15px; line-height: 1.2; }
.btn:hover { background: #2f4439; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { background: #f0c268; }
.btn.danger { background: #5a2523; border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { background: var(--panel-2); }
.btn.primary:disabled:hover { background: var(--accent); }
.btn:focus-visible, .card.pick:focus-visible, .pile.clickable .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn .mini-row { --cw: 22px; margin-left: 6px; vertical-align: middle; }

/* table grid */
.table { flex: 1 1 auto; display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 4fr) minmax(120px, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "north north north" "west center east"; gap: 10px; }
.seat-north { grid-area: north; }
.seat-west { grid-area: west; }
.seat-east { grid-area: east; }
.center { grid-area: center; }

/* opponents' seats */
.seat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid transparent; min-width: 0; }
.seat.active, .you.active { border-color: rgba(226, 176, 79, 0.65); background: rgba(0, 0, 0, 0.2); }
.seat header, .you header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: var(--fg-dim); }
.seat .nm, .you .nm { font-weight: 700; font-size: 16px; color: var(--fg); }
.tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.3); color: var(--fg-dim); line-height: 1.2; }
.tag.dealer { background: var(--accent); color: var(--accent-ink); }
.tag.purro { background: var(--copas); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
.tag.us { color: var(--accent); }
.fan { display: flex; justify-content: center; flex-wrap: wrap; --cw: 34px; max-width: 100%; padding-left: calc(var(--cw) * 0.7); }
.fan .card { margin-left: calc(var(--cw) * -0.7); }
.fan.open { --cw: 40px; padding-left: calc(var(--cw) * 0.45); }
.fan.open .card { margin-left: calc(var(--cw) * -0.45); }
.seat-west .fan, .seat-east .fan { --cw: 30px; }
.extras { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.secret, .marker { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.stack { display: flex; --cw: 26px; padding-left: calc(var(--cw) * 0.55); }
.stack .card { margin-left: calc(var(--cw) * -0.55); }
.marker { --cw: 30px; }
.stack .card.extra { margin-left: 5px; outline: 2px dashed var(--warn); outline-offset: -2px; }
.tag.penalty { background: #5a3a12; color: #f6d9a0; }

/* centre */
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 0; padding: 6px 0; }
.piles { display: flex; gap: clamp(14px, 3vw, 40px); align-items: flex-end; justify-content: center; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
.pile .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); }
.slot { width: var(--cw); height: calc(var(--cw) * 1.55); border-radius: calc(var(--cw) * 0.09); border: 2px dashed rgba(255, 255, 255, 0.25); }
.pile .cnt { position: absolute; top: -9px; right: -10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; padding: 1px 7px; font-variant-numeric: tabular-nums; z-index: 1; }
.pile.clickable .card { cursor: pointer; box-shadow: 0 0 0 2px var(--accent), 0 6px 14px rgba(0, 0, 0, 0.4); transition: transform 0.15s ease; }
.pile.clickable .card:hover { transform: translateY(-5px); }
.pile.wins .card { box-shadow: 0 0 0 2px var(--good), 0 0 18px var(--good); }
.status { margin: 0; text-align: center; font-size: 17px; max-width: 60ch; text-wrap: balance; min-height: 1.4em; }
.status strong { color: var(--accent); }
.notice { color: var(--warn); }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--fg-dim); max-width: 62ch; width: 100%; }
.log li { padding: 2px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); display: flex; gap: 6px; align-items: center; }
.log li:first-child { border-top: 0; }
.log li.purro, .log li.time, .log li.over, .log li.secret { color: var(--fg); }
.shown-card { --cw: 22px; display: inline-flex; vertical-align: middle; }

/* your seat */
.you { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 8px; border-radius: 14px; background: rgba(0, 0, 0, 0.16); border: 1px solid transparent; }
.hand { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; padding: 16px 0 8px; gap: 16px 12px; min-height: calc(var(--cw) * 1.55 + 22px); }
.hand .card { margin-left: calc(var(--cw) * -0.36); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.hand .card.pick { cursor: pointer; }
.hand .card.pick:hover, .hand .card.pick:focus-visible { transform: translateY(-8px); z-index: 2; }
.hand .card.selected { transform: translateY(-16px); box-shadow: 0 0 0 2px var(--accent), 0 8px 18px rgba(0, 0, 0, 0.45); z-index: 3; }
.hand .card.drawn { box-shadow: 0 0 0 2px var(--good), 0 4px 12px rgba(0, 0, 0, 0.4); }

.hand .card.meld::after, .hand .card.part::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 0; height: 4px; border-radius: 3px 3px 0 0; background: var(--good); }
.hand .card.part::after { background: var(--warn); }
.hand-tools { display: flex; gap: 6px 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; }
.hand-tools .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); }
.btn.chip { padding: 4px 11px; font-size: 13px; border-radius: 999px; font-weight: 600; }
.btn.chip.on { border-color: rgba(226, 176, 79, 0.7); color: var(--accent); }
.drag-hint { color: var(--fg-dim); }
.hand .card { cursor: grab; touch-action: manipulation; -webkit-touch-callout: none; }
.hand .card.pick { cursor: pointer; }
.hand .card.placeholder { opacity: 0.3; transform: none !important; box-shadow: 0 0 0 2px var(--accent); }
.card.ghost { position: fixed; left: 0; top: 0; margin: 0; z-index: 60; pointer-events: none; transform: rotate(-3deg) scale(1.08); transition: none; box-shadow: 0 16px 30px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--accent); }
body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
body.dragging .hand .card:hover { transform: none; }
.pile.discard.drop-target > :first-child { outline: 2px dashed var(--accent); outline-offset: 5px; }
.pile.discard.drop-hover > :first-child { outline: 3px solid var(--good); outline-offset: 5px; transform: scale(1.06); }
.hint { text-align: center; font-size: 14px; color: var(--fg-dim); min-height: 1.4em; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.mini-row { display: inline-flex; gap: 3px; --cw: 26px; vertical-align: middle; flex-wrap: wrap; }
.bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }

/* cards */
.card { position: relative; width: var(--cw); height: calc(var(--cw) * 1.55); border-radius: calc(var(--cw) * 0.09); background: linear-gradient(160deg, #fbf7ee 0%, #f1e9d6 100%); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(60, 40, 20, 0.35); flex: 0 0 auto; user-select: none; -webkit-user-select: none; overflow: hidden; }
.card.s-coins { --suit: var(--oros); }
.card.s-cups { --suit: var(--copas); }
.card.s-swords { --suit: var(--espadas); }
.card.s-batons { --suit: var(--bastos); }
.card .face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.face .ix { font-family: var(--font-display); font-weight: 700; font-size: 24px; fill: #2a2118; }
.face .ix.big { font-size: 46px; }
.face .tiny { font-family: var(--font-display); font-weight: 700; font-size: 6.5px; letter-spacing: 1.2px; fill: #2a2118; }
.card.back { background: repeating-linear-gradient(45deg, #8a2a2e 0 4px, #6d1c20 4px 8px), #6d1c20; border: calc(var(--cw) * 0.07) solid var(--ivory); }
.card.back::after { content: ''; position: absolute; inset: 10%; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; }
.card.bounit { box-shadow: 0 0 0 2px var(--good), 0 0 12px var(--good); }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(5, 12, 10, 0.64); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 700px; width: 100%; max-height: min(92vh, 100%); overflow: auto; padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.modal h2 { font: 700 24px/1.15 var(--font-display); margin: 0 0 6px; color: var(--accent); letter-spacing: 0.04em; text-wrap: balance; }
.modal h3 { margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); font-size: 13px; font-weight: 700; }
.modal p { margin: 6px 0; max-width: 68ch; }
.modal .box > .bar { margin-top: 18px; justify-content: flex-end; }
.groups { display: flex; flex-wrap: wrap; gap: 10px; }
.group { display: flex; gap: 3px; padding: 6px; border-radius: 8px; background: rgba(0, 0, 0, 0.28); --cw: 40px; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 15px; margin: 0; }
.kv dt { color: var(--fg-dim); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.rules { font-size: 15px; line-height: 1.5; }
.rules ul, .rules ol { padding-left: 20px; }
.rules li { margin: 3px 0; max-width: 68ch; }
.rules dl { margin: 6px 0; }
.rules dt { font-weight: 700; margin-top: 8px; }
.rules dd { margin: 0; max-width: 68ch; }
.rules table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 6px 0; }
.rules th, .rules td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); }
.rules a { color: var(--accent); }
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.settings .row:first-of-type { border-top: 0; }
.settings input[type=text], .settings select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.settings input[type=text] { width: 11em; }
.settings input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.time-card { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
.time-card .card { --cw: 64px; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 760px) {
  .table { grid-template-columns: 1fr 1fr; grid-template-areas: "north north" "west east" "center center"; gap: 6px; }
  .seat-west .fan, .seat-east .fan { display: none; }
  .seat { padding: 6px 4px; }
  .status { font-size: 15px; }
  .hand { padding-top: 10px; }
  .brand .sub { display: none; }
}
@media (max-width: 460px) {
  :root { --cw: calc(44px * var(--size)); }
  .seat-north .fan { --cw: 26px; }
  .modal .box { padding: 16px 14px 14px; }
}

/* groups in your hand */
.seg { position: relative; display: flex; flex-wrap: wrap; padding-left: calc(var(--cw) * 0.36); row-gap: 16px; }
.seg.grp { padding: 24px 8px 8px calc(var(--cw) * 0.36 + 8px); border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); }
.seg.grp.ok { border-color: rgba(143, 211, 154, 0.6); background: rgba(143, 211, 154, 0.1); }
.seg.grp.part { border-color: rgba(240, 163, 94, 0.55); background: rgba(240, 163, 94, 0.07); }
.grp-tag { position: absolute; top: 3px; left: 8px; right: 4px; display: flex; white-space: nowrap; overflow: hidden; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); cursor: grab; -webkit-user-select: none; user-select: none; }
.grp-name { overflow: hidden; text-overflow: ellipsis; }
.seg.grp.ok .grp-name { color: var(--good); }
.seg.grp.part .grp-name { color: var(--warn); }
.grp-x { border: 0; background: transparent; color: var(--fg-dim); font-size: 17px; line-height: 1; padding: 0 4px; cursor: pointer; border-radius: 4px; }
.grp-x:hover, .grp-x:focus-visible { color: var(--fg); background: rgba(255, 255, 255, 0.12); }
.seg.grp .card.selected { transform: translateY(-10px); }
.seg.placeholder { opacity: 0.35; }
.seg.ghost { position: fixed; left: 0; top: 0; margin: 0; z-index: 60; pointer-events: none; transform: rotate(-2deg) scale(1.03); background: var(--panel-2); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5); }
.btn.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* watching the other players */
.card.flying { position: fixed; left: 0; top: 0; margin: 0; z-index: 70; pointer-events: none; transform-origin: 0 0; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45); }
#app.dealing .fan .card, #app.dealing #hand .card, #app.dealing .pile.sowee .card, #app.dealing .pile.discard .card { visibility: hidden; }
.thinking { display: inline-flex; gap: 3px; align-items: center; padding: 0 2px; }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: 0.18s; }
.thinking i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.bubble { position: absolute; left: 50%; top: 0; transform: translate(-50%, -70%); background: var(--ivory); color: var(--ink); font: 700 17px/1 var(--font-display); letter-spacing: 0.04em; padding: 8px 14px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); z-index: 30; white-space: nowrap; pointer-events: none; animation: pop 0.28s cubic-bezier(0.3, 1.6, 0.5, 1); }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--ivory); }
@keyframes pop { from { transform: translate(-50%, -40%) scale(0.6); opacity: 0; } to { transform: translate(-50%, -70%) scale(1); opacity: 1; } }
.btn.next { display: inline-flex; align-items: center; gap: 6px; }
.btn.next kbd { font: 600 11px/1 var(--font-body); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg-dim); }

.center-bar { display: flex; justify-content: center; min-height: 38px; }

/* playing with a friend */
.friend .join-code { font: 700 34px/1 var(--font-display); letter-spacing: 0.25em; text-align: center; color: var(--accent); padding: 10px 0 4px; }
.link-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.link-row input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.friend .wait { display: flex; gap: 8px; align-items: center; color: var(--fg-dim); }
.error { color: var(--bad); }
.handover { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 8px; text-align: center; width: 100%; }
.handover p { margin: 0; font-size: 17px; max-width: 40ch; }
.tag.friend { background: rgba(143, 211, 154, 0.2); color: var(--good); }

/* phones: the whole table on one screen */
@media (max-width: 600px) {
  #app { gap: 6px; padding-block: 6px; }
  .topbar { gap: 6px 8px; }
  .brand h1 { font-size: 20px; }
  .topbar .actions { gap: 5px; }
  .topbar .btn { padding: 5px 9px; font-size: 13px; }
  .scores { order: 3; width: 100%; gap: 4px; font-size: 12px; }
  .sc { padding: 1px 7px; gap: 4px; }
  .table { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "west north east" "center center center"; gap: 4px; }
  .seat { padding: 4px 2px; gap: 3px; }
  .seat .fan { display: none; }
  .seat header { gap: 3px 5px; font-size: 12px; }
  .seat .nm { font-size: 14px; }
  .seat .tag.role:not(.us) { display: none; }
  .tag { font-size: 10px; padding: 1px 4px; }
  .extras { gap: 4px; }
  .center { gap: 6px; padding: 2px 0; }
  .piles { gap: 14px; }
  .pile .lbl { font-size: 10px; }
  .status { font-size: 14px; min-height: 0; }
  .center-bar { min-height: 0; }
  .btn.next { padding: 5px 12px; font-size: 13px; }
  .log { font-size: 12px; }
  .log li:nth-child(n+3) { display: none; }
  .you { padding: 6px 4px; gap: 4px; }
  .you header { font-size: 13px; gap: 4px 6px; }
  .hand-tools { gap: 4px 5px; }
  .hand-tools .lbl, .drag-hint { display: none; }
  .btn.chip { padding: 3px 9px; font-size: 12px; }
  .hand { --cw: calc(min(13.2vw, 54px) * var(--size)); padding-top: 12px; gap: 12px 8px; min-height: 0; }
  .seg { row-gap: 12px; }
  .seg.grp { padding: 20px 5px 5px calc(var(--cw) * 0.36 + 5px); }
  .hint { font-size: 12.5px; min-height: 0; }

.card.ghost { box-shadow: 0 16px 30px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--accent); }

  // ---------- Game state ----------
  function nextRand(g) { // mulberry32, state kept in g.rng so games are reproducible/serialisable

      humans: (opts.humans || [opts.human !== undefined ? opts.human : 0]).slice(),
      dealRule: opts.dealRule === 'right' ? 'right' : 'winner',
      balances: [0, 0, 0, 0], wins: [0, 0, 0, 0], handsPlayed: 0, draws: 0,
      dealer: opts.dealer || 0, nextDealer: opts.dealer || 0,
      handNo: 0, phase: 'idle', events: [],
      hands: [[], [], [], []], secrets: [[], [], [], []], stock: [], discards: [], discardedBy: [], history: [], seenIds: {},
      purro: [false, false, false, false], waiting: [[], [], [], []], marker: [null, null, null, null], penalty: [0, 0, 0, 0],

  function startHand(g) {

    for (let i = NCARDS - 1; i > 0; i--) { const j = randInt(g, i + 1); const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp; }

    g.purro = [false, false, false, false]; g.waiting = [[], [], [], []]; g.marker = [null, null, null, null]; g.penalty = [0, 0, 0, 0];
    g.discards = []; g.discardedBy = []; g.history = []; g.seen = new Array(NTYPES).fill(0); g.seenIds = {};
    g.events = []; g.result = null; g.timeOffer = null; g.lastShown = null; g.drawn = null; g.drawnFrom = null;

  /** Seven kings, prinsesa or rub straight from the deal, then a dealer complete as dealt.

    const hint = $('#hint'); hint.innerHTML = '';
    if (settings.hints && g.phase !== 'idle' && g.phase !== 'over' && g.phase !== 'timeOffer' && g.phase !== 'rubOffer') {
      const a = C.analyze(g, ME), top = C.topDiscard(g);

  /** Class per card id from the planner: complete groups 'meld', one-short groups 'part'. */
  function handMarks() {
    const marks = {};
    if (!settings.hints || g.phase === 'idle' || g.phase === 'over') return marks;
    const plan = C.planFor(g, ME);
    const pool = g.hands[ME].slice().sort(byType).concat(C.extrasOf(g, ME));
    const complete = { king: 1, secret: 1, set: 1, run: 1, pong: 1 }, partial = { set2: 1, run2: 1, pong2: 1, secret3: 1 };
    for (const gp of plan) {
      const cls = complete[gp.kind] ? 'meld' : partial[gp.kind] ? 'part' : null;
      for (const t of gp.types) {
        const i = pool.findIndex(id => C.cardType(id) === t);
        if (i < 0) continue;
        const id = pool.splice(i, 1)[0];
        if (cls) marks[id] = cls;
      }
    }
    return marks;
  }

  // ---------- playing with a friend ----------
  // Two routes to the other computer: a direct browser-to-browser connection (PeerJS/WebRTC), and,
  // when that cannot be made (some networks block it), a relay through three public MQTT servers at
  // once. Relay messages are encrypted with a key made from the game code. The host's computer runs
  // the game and sends the guest only what that seat may see; the guest sends back its moves.
  const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
  const MQTT_URL = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
  const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081'];
  const ICE = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }, { urls: 'stun:stun.cloudflare.com:3478' }] };
  const QS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
  const FORCE_RELAY = QS.get('relay') === '1';          // testing: skip the direct route
  const PID = (() => { let p = null; try { p = sessionStorage.getItem('cuajo.pid'); } catch (e) { /* no storage */ } if (!p) { p = makeCode() + makeCode(); try { sessionStorage.setItem('cuajo.pid', p); } catch (e) { /* no storage */ } } return p; })();
  const loaded = {};
  function loadScript(src, globalName) {
    if (window[globalName]) return Promise.resolve();
    if (!loaded[src]) loaded[src] = new Promise((res, rej) => {
      const s = document.createElement('script'); s.src = src;
      s.onload = () => (window[globalName] ? res() : rej(new Error(globalName + ' missing')));
      s.onerror = () => { delete loaded[src]; rej(new Error(src + ' did not load')); };
      document.head.appendChild(s);
    });
    return loaded[src];
  }
  const WEB_NOTE = 'Online play works on the website (' + PAGES_URL + ') and in the downloaded file, but not inside the Claude preview.';
  function makeCode() {
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', a = new Uint32Array(5);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, x => A[x % A.length]).join('');
  }
  function joinLink(code) {
    const base = /^https?:$/.test(location.protocol) && location.hostname.indexOf('claude') < 0 ? location.origin + location.pathname : PAGES_URL;
    return base + '?join=' + code;
  }

  // --- encryption for the relay route ---
  async function roomKeys(code) {
    const enc = new TextEncoder(), sha = async s => new Uint8Array(await crypto.subtle.digest('SHA-256', enc.encode(s)));
    const t = await sha('cuajo-room:' + code);
    const room = 'cuajo/v1/' + Array.from(t.slice(0, 12), b => b.toString(16).padStart(2, '0')).join('');
    const key = await crypto.subtle.importKey('raw', await sha('cuajo-key:' + code), 'AES-GCM', false, ['encrypt', 'decrypt']);
    return { room, key };
  }
  async function seal(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj))));
    const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
  }
  async function unseal(key, bytes) {
    const b = new Uint8Array(bytes);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b.slice(0, 12) }, key, b.slice(12))));
  }
  /** Joins the game's relay channel on every relay server; messages go out on all of them and repeats are dropped. */
  async function openRelay(code, role) {
    await loadScript(MQTT_URL, 'mqtt');
    const { room, key } = await roomKeys(code);
    const inbox = room + (role === 'host' ? '/to-host' : '/to-guest'), outbox = room + (role === 'host' ? '/to-guest' : '/to-host');
    const r = { kind: 'relay', me: makeCode() + makeCode(), clients: [], handlers: [], seen: {}, seq: 0, closed: false };
    r.onMessage = fn => r.handlers.push(fn);
    r.send = msg => {
      if (r.closed) return;
      seal(key, { f: r.me, s: ++r.seq, m: msg }).then(env => { for (const c of r.clients) if (c.connected) { try { c.publish(outbox, env, { qos: 0 }); } catch (e) { /* this server is down */ } } });
    };
    r.close = () => { r.closed = true; for (const c of r.clients) { try { c.end(true); } catch (e) { /* ignore */ } } };
    r.servers = () => r.clients.filter(c => c.connected).length;
    RELAYS.forEach((url, i) => {
      const c = window.mqtt.connect(url, { clientId: 'cuajo_' + r.me + '_' + i, clean: true, connectTimeout: 7000, reconnectPeriod: 3000, keepalive: 30 });
      c.on('connect', () => c.subscribe(inbox, { qos: 0 }));
      c.on('message', (topic, payload) => {
        if (topic !== inbox || r.closed) return;
        unseal(key, payload).then(env => {
          if (!env || !env.f || env.f === r.me || r.closed) return;
          if (env.s <= (r.seen[env.f] || 0)) return;        // the same message through another server
          r.seen[env.f] = env.s;
          for (const h of r.handlers) h(env.m, env.f);
        }, () => { /* not ours */ });
      });
      c.on('error', () => { /* keep trying the others */ });
      r.clients.push(c);
    });
    await new Promise(res => { const t0 = Date.now(); (function wait() { if (r.servers() || Date.now() - t0 > 9000) res(); else setTimeout(wait, 100); })(); });
    if (!r.servers()) { r.close(); throw new Error('no relay server reachable'); }
    return r;
  }
  /** Wraps a direct PeerJS connection in the same shape as the relay. */
  function directLink(conn) {
    const l = { kind: 'direct', conn, handlers: [], closeHandlers: [], closed: false };
    l.onMessage = fn => l.handlers.push(fn);
    l.onClose = fn => l.closeHandlers.push(fn);
    l.send = msg => { if (!l.closed && conn.open) { try { conn.send(msg); } catch (e) { /* closing */ } } };
    l.close = () => { l.closed = true; try { conn.close(); } catch (e) { /* ignore */ } };
    conn.on('data', m => { if (!l.closed) for (const h of l.handlers) h(m); });
    conn.on('close', () => { if (!l.closed) { l.closed = true; for (const h of l.closeHandlers) h(); } });
    return l;
  }
  function closeNet(n) {
    if (!n) return;
    try { if (n.link && n.link.direct) n.link.direct.close(); } catch (e) { /* ignore */ }
    try { if (n.relay) n.relay.close(); } catch (e) { /* ignore */ }
    try { if (n.peer) n.peer.destroy(); } catch (e) { /* ignore */ }
  }
  /** Host: to every friend at the table. Guest: to the host. */
  function send(msg) {
    if (!net) return;
    if (net.role === 'host') { for (const gu of Object.values(net.guests || {})) if (gu.link) gu.link.send(msg); }
    else if (net.link) net.link.send(msg);
  }
  // Every few seconds each side says hello; after 16 s of silence the other computer counts as gone.
  setInterval(() => {
    if (!net) return;
    if (net.role === 'host') {
      for (const gu of Object.values(net.guests || {})) {
        if (!gu.link) continue;
        gu.link.send({ t: 'ping' });
        if (Date.now() - (gu.lastSeen || Date.now()) > 16000) friendGone(gu.seat, false);
      }
      return;
    }
    if (!net.link) return;
    net.link.send({ t: 'ping' });
    if (Date.now() - (net.lastSeen || Date.now()) > 16000) linkLost();
  }, 4000);

  /** What the guest's seat is allowed to see: other hands, the stock and the shuffle stay hidden until the hand is over. */
  function viewFor(seat) {
    const v = JSON.parse(JSON.stringify(g)), over = g.phase === 'over';
    v.rng = 0; v.seed = 0;
    v.stock = g.stock.map(() => -1);
    for (let s = 0; s < 4; s++) {
      if (s === seat || over) continue;
      v.hands[s] = g.hands[s].map(id => (g.purro[s] && id === g.marker[s]) ? id : -1);
      v.secrets[s] = g.secrets[s].map(x => Object.assign({}, x, { cards: x.cards.map(() => -1), extra: x.extra != null ? -1 : null, type: x.kind === 'sowee' ? x.type : -1 }));
      v.waiting[s] = [];
      if (v.rubWait) v.rubWait[s] = false;
    }
    if (!over && v.rubOffer && v.rubOffer.seat !== seat) v.rubOffer = Object.assign({}, v.rubOffer, { type: -1 });
    if (!over && g.drawn != null && g.turn !== seat && g.drawnFrom === 'stock' && !(g.lastShown && g.lastShown.id === g.drawn)) v.drawn = null;
    return v;
  }
  function sendState() {
    const move = lastMove; lastMove = null;
    if (!net || net.role !== 'host') return;
    for (const gu of Object.values(net.guests)) if (gu.link) sendStateTo(gu, move);
  }
  function sendStateTo(gu, move) {
    const m = move && move.kind === 'draw' && move.src === 'stock' && !move.shown && move.seat !== gu.seat ? Object.assign({}, move, { id: null }) : (move || null);
    gu.link.send({ t: 'state', view: viewFor(gu.seat), move: m });
  }
  function myNameInput() {
    const n = (($('#friend-myname') || {}).value || '').trim().slice(0, 14);
    if (n) settings.names[0] = n;
    return settings.names[0];
  }
  function startLocal() {
    myNameInput();
    const seat = +(($('#friend-seat') || {}).value || 2);
    const friend = ((($('#friend-name') || {}).value || '').trim() || 'Friend').slice(0, 14);
    mode = 'local'; ME = 0; humanNames = {}; humanNames[seat] = friend;
    modal = null;
    newGame([0, seat]);
    deal();
  }

  // --- hosting (up to three friends; they take the computer players' seats) ---
  const FRIEND_SEATS = [2, 1, 3];
  async function hostOnline() {
    myNameInput(); save();
    const pref = +(($('#friend-seat') || {}).value || 2);
    friendUi.error = '';
    const mine = net = { role: 'host', code: makeCode(), prefSeat: pref, ready: false, started: false, peer: null, relay: null, guests: {} };
    renderModal(true);
    if (!FORCE_RELAY) await startHostPeer(mine);          // settles the code (it must be free on the direct route)
    if (net !== mine) return;
    try {
      const r = await openRelay(mine.code, 'host');
      if (net !== mine) { r.close(); return; }
      mine.relay = r;
      r.onMessage((m, from) => hostIncoming(m, { kind: 'relay', from }));
    } catch (e) { console.warn('relay route unavailable', e); }
    if (net !== mine) return;
    if (!mine.peer && !mine.relay) { friendUi.error = 'Could not reach the connection services. Check the internet connection and try again. ' + WEB_NOTE; closeNet(mine); net = null; }
    else mine.ready = true;
    renderModal(true);
  }
  async function startHostPeer(mine) {
    try { await loadScript(PEERJS_URL, 'Peer'); } catch (e) { return; }
    for (let tries = 0; tries < 3 && net === mine; tries++) {
      const ok = await new Promise(res => {
        const peer = new window.Peer('cuajo-' + mine.code, { config: ICE });
        let settled = false;
        const done = v => { if (!settled) { settled = true; res(v); } };
        peer.on('open', () => { mine.peer = peer; done('ok'); });
        peer.on('connection', conn => conn.on('open', () => {
          if (net !== mine) { try { conn.close(); } catch (e) { /* ignore */ } return; }
          const l = directLink(conn);
          l.onMessage(m => hostIncoming(m, { kind: 'direct', link: l }));
          l.onClose(() => { if (net !== mine) return; const gu = Object.values(mine.guests).find(x => x.link && x.link.direct === l); if (gu) friendGone(gu.seat, false); });
        }));
        peer.on('error', e => {
          if (e.type === 'unavailable-id') { try { peer.destroy(); } catch (x) { /* ignore */ } done('taken'); return; }
          if (!settled) { try { peer.destroy(); } catch (x) { /* ignore */ } done('failed'); }
          else console.warn('direct route', e.type);
        });
        setTimeout(() => { if (!settled) { try { peer.destroy(); } catch (x) { /* ignore */ } done('failed'); } }, 7000);
      });
      if (ok === 'taken') { mine.code = makeCode(); continue; }
      return;
    }
  }
  function activeHumans() { return [0].concat(Object.values(net.guests).filter(x => !x.away).map(x => x.seat)).sort(); }
  function freeSeat() { return [net.prefSeat].concat(FRIEND_SEATS.filter(s => s !== net.prefSeat)).find(s => !net.guests[s]); }
  function makeLink(via) {
    return via.kind === 'relay'
      ? { kind: 'relay', from: via.from, send: m => net && net.relay && net.relay.send(Object.assign({ to: via.from }, m)) }
      : { kind: 'direct', direct: via.link, send: m => via.link.send(m) };
  }
  function guestFor(via) {
    for (const gu of Object.values(net.guests)) {
      const l = gu.link;
      if (l && (via.kind === 'relay' ? l.kind === 'relay' && l.from === via.from : l.direct === via.link)) return gu;
    }
    return null;
  }
  function seatWord(seat) { return seat === 2 ? 'the partner seat' : seat === 1 ? 'the seat on your right' : 'the seat on your left'; }
  function hostIncoming(msg, via) {
    if (!msg || !net || net.role !== 'host') return;
    const mine = net;
    let gu = guestFor(via);
    if (msg.t === 'hello') {
      if (gu && mine.started) { gu.lastSeen = Date.now(); gu.link.send({ t: 'welcome', seat: gu.seat, v: 3 }); sendStateTo(gu, null); return; }   // a repeated hello
      const nm0 = String(msg.name || '').trim().slice(0, 14);
      let seat = null;
      for (const x of Object.values(mine.guests)) if (msg.pid && x.pid === msg.pid) seat = x.seat;   // the same person coming back
      const back = seat != null;
      if (!back) seat = freeSeat();
      if (seat == null) {
        if (via.kind === 'relay') mine.relay.send({ t: 'full', to: via.from }); else via.link.send({ t: 'full' });
        return;
      }
      const old = mine.guests[seat];
      if (old && old.link && old.link.direct && old.link.direct !== via.link) old.link.direct.close();
      const taken = Object.values(mine.guests).filter(x => x.seat !== seat).map(x => x.name);
      let nm = nm0 && nm0 !== 'You' ? nm0 : 'Friend';
      if (taken.indexOf(nm) >= 0 || nm === name(0)) nm = nm + ' ' + (seat === 2 ? 'N' : seat === 1 ? 'E' : 'W');
      gu = mine.guests[seat] = { seat, pid: msg.pid || null, name: nm, link: makeLink(via), lastSeen: Date.now(), away: false };
      humanNames[seat] = nm;
      gu.link.send({ t: 'welcome', seat, v: 3 });
      if (!mine.started) {
        mine.started = true; mode = 'host'; if (ME !== 0) switchMe(0);
        if (modal === 'friend') modal = null;
        newGame(activeHumans());      // a fresh scoreboard for everyone at the table
        deal();
        flash(nm + ' joined the game.');
        return;
      }
      g.humans = activeHumans(); applyNames(); C.setDifficulty(g, settings.difficulty);
      flash(back ? nm + ' is back in the game.' : nm + ' joined and takes over ' + seatWord(seat) + '.');
      changed();
      if (modal === 'friend') renderModal(true);
      return;
    }
    if (!gu) return;
    gu.lastSeen = Date.now();
    const seat = gu.seat;
    if (msg.t === 'ping') { gu.link.send({ t: 'pong' }); return; }
    if (msg.t === 'pong') return;
    if (msg.t === 'bye') { friendGone(seat, true); return; }
    if (msg.t === 'chat') { const text = cleanChat(msg.text); if (text) { addChat(seat, text); send({ t: 'chat', seat, text }); } return; }
    if (mode !== 'host') return;
    if (msg.t === 'skip') { skipAhead(); return; }
    if (msg.t !== 'act') return;
    try {
      if (msg.a === 'deal') { if (!dealing && (g.phase === 'over' || g.phase === 'idle')) deal(); return; }
      if (msg.a === 'newmatch') { if (!dealing && g.phase === 'over' && g.match && g.match.done) newMatch(); return; }
      if (dealing) return;
      const la = C.legalActions(g, seat), a = msg.a, arg = msg.arg;
      const ok = a === 'drawStock' ? la.drawStock : a === 'takeDiscard' ? la.takeDiscard : a === 'endHand' ? la.endHand
        : a === 'discard' ? la.discard && g.hands[seat].indexOf(arg) >= 0 && !C.isKing(arg)
        : a === 'secret' ? la.discard && !!arg && la.secrets.some(o => o.type === arg.type)
        : a === 'time' ? la.timeClaim : a === 'rub' ? la.rubChoice : a === 'rubNow' ? la.declareRub : false;
      if (!ok) { sendStateTo(gu, null); return; }
      const r = act(seat, a, arg); announce(r.b); drive();
    } catch (e) { console.error(e); sendStateTo(gu, null); }
  }
  /** A friend left on purpose (their seat opens up) or dropped out (their seat waits for them; a computer fills in). */
  function friendGone(seat, onPurpose) {
    if (!net || net.role !== 'host' || !net.guests[seat]) return;
    const gu = net.guests[seat], nm = gu.name;
    if (gu.link && gu.link.direct) gu.link.direct.close();
    gu.link = null;
    if (onPurpose) { delete net.guests[seat]; delete humanNames[seat]; } else gu.away = true;
    if (!net.started) { renderModal(true); return; }
    if (g) { g.humans = activeHumans(); applyNames(); C.setDifficulty(g, settings.difficulty); }
    flash(onPurpose ? nm + ' left. A computer player takes that seat.' : nm + ' lost the connection. A computer player fills in until they rejoin.');
    changed();
    if (modal === 'friend') renderModal(true);
  }

  // --- joining ---
  async function joinOnline() {
    myNameInput();
    const code = ((($('#join-code') || {}).value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''));
    friendUi.joinCode = code;
    if (code.length < 4) { friendUi.error = 'Type the game code your friend sent you.'; renderModal(true); return; }
    save();                          // keep your own game; it comes back when you leave
    friendUi.error = '';
    const mine = net = { role: 'guest', code, connected: false, link: null, peer: null, relay: null, reconnecting: false };
    renderModal(true);
    const ok = await connectGuest(mine);
    if (net === mine && !ok) { friendUi.error = 'No game found with code ' + code + '. Check the code with your friend, and make sure their game is still open.'; closeNet(mine); net = null; renderModal(true); }
  }
  /** Tries the direct route first, then the relay. Resolves true once the host has welcomed us. */
  async function connectGuest(mine) {
    if (!FORCE_RELAY && await guestDirect(mine, 6000)) return true;
    if (net !== mine) return false;
    return guestRelay(mine, 10000);
  }
  function waitWelcome(mine, ms) {
    return new Promise(res => { const t0 = Date.now(); (function w() { if (net !== mine) res(false); else if (mine.welcomed) res(true); else if (mine.routeFailed || Date.now() - t0 > ms) res(false); else setTimeout(w, 100); })(); });
  }
  async function guestDirect(mine, ms) {
    try { await loadScript(PEERJS_URL, 'Peer'); } catch (e) { return false; }
    mine.welcomed = false; mine.routeFailed = false;
    const peer = new window.Peer({ config: ICE });
    mine.peer = peer;
    peer.on('open', () => {

    if (g.phase === 'over' && g.result && mark('h:' + id)) {
      const r = g.result;
      stats.hands++;
      if (r.type === 'draw') stats.draws++;

        stats.won++; stats.streak++; stats.bestStreak = Math.max(stats.bestStreak, stats.streak);

  // ---------- boot ----------
  function wire() {
    $('#btn-rules').addEventListener('click', () => { modal = 'rules'; render(); });
    $('#btn-friend').addEventListener('click', () => { modal = 'friend'; friendUi.error = ''; renderModal(true); });
    $('#btn-chat').addEventListener('click', toggleChat);
    $('#btn-install').addEventListener('click', installApp);
    $('#btn-full').addEventListener('click', toggleFullscreen);
    document.addEventListener('fullscreenchange', () => render());
    document.addEventListener('webkitfullscreenchange', () => render());
    $('#btn-settings').addEventListener('click', () => { modal = 'settings'; confirmReset = false; render(); });
    document.addEventListener('keydown', e => {
      const typing = e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
      if ((e.key === 'n' || e.key === 'N') && !typing && !modal && !e.metaKey && !e.ctrlKey && !e.altKey) { skipAhead(); return; }
      if (e.key !== 'Escape') return;
      if (drag && drag.active) { endDrag(true); return; }
      if (modal && modal !== 'time' && modal !== 'rub') closeModal();
    });
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
    window.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
    window.addEventListener('blur', () => { if (drag && drag.active) endDrag(true); });
  }
  function validGame(x) {
    if (!x || x.version !== 2) return false;
    for (const k of ['balances', 'wins', 'hands', 'secrets', 'purro', 'waiting', 'marker', 'penalty']) if (!Array.isArray(x[k]) || x[k].length !== 4) return false;
    if (['idle', 'draw', 'discard', 'timeOffer', 'over'].indexOf(x.phase) < 0) return false;
    if (x.phase === 'over' && !x.result) return false;
    if (x.phase === 'timeOffer' && !x.timeOffer) return false;
    return Array.isArray(x.stock) && Array.isArray(x.discards) && Array.isArray(x.events) && !!x.seenIds;
  }
  function start(data) {
    const saved = (data && data.g) ? data : load();
    if (saved && saved.settings) {
      settings = Object.assign({}, DEFAULT_SETTINGS, saved.settings, { names: (Array.isArray(saved.settings.names) && saved.settings.names.length === 4 ? saved.settings.names : DEFAULT_SETTINGS.names).slice() });
      if (saved.settings.v !== 2) { settings.speed = 'realistic'; settings.v = 2; }   // older copies ran the other players quickly
      if (PACE[settings.speed] === undefined) settings.speed = 'realistic';
    }
    if (saved && validGame(saved.g)) g = saved.g;
    else g = C.newGame({ names: settings.names, human: 0 });
    const multi = saved && saved.multi;
    if (multi && multi.mode === 'local' && g === saved.g && Array.isArray(g.humans) && g.humans.length > 1) { mode = 'local'; humanNames = multi.humanNames || {}; handHidden = true; }
    else g.humans = [0];
    applyNames(); C.setDifficulty(g, settings.difficulty); g.dealRule = settings.dealRule;
    applyLook();
    if (saved && saved.order && Array.isArray(saved.order.ids) && g === saved.g) {
      handOrder = saved.order.ids.filter(x => typeof x === 'number'); orderHand = saved.order.hand | 0;
      if (saved.order.groups && typeof saved.order.groups === 'object') groupOf = Object.assign({}, saved.order.groups);
      nextGid = Math.max(saved.order.next | 0, 1, ...Object.values(groupOf).map(v => (v | 0) + 1));
    }
    if (data && data.ui) { selIds = Array.isArray(data.ui.selIds) ? data.ui.selIds.slice() : []; pickExtra = data.ui.pickExtra != null ? data.ui.pickExtra : null; modal = data.ui.modal || null; }
    if (g.phase === 'over') resultShown = true;
    try { const j = new URLSearchParams(location.search).get('join'); if (j) { friendUi.joinCode = j.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); modal = 'friend'; } } catch (e) { /* no query string here */ }
    wire();
    if (!render()) { mode = 'solo'; humanNames = {}; g = C.newGame({ names: settings.names, human: 0 }); applyNames(); C.setDifficulty(g, settings.difficulty); selIds = []; groupOf = {}; pickExtra = null; modal = null; render(); }
    drive();
  }
  // Small handle for automated play-testing (state is read-only from here; actions go through the same code paths as the UI).
  window.cuajoDebug = {
    state: () => g,
    engine: C,
    deal, newGame,
    drawStock: onStock, takeDiscard: onTake, endHand: onEnd,
    discard: id => onDiscard(id), secret: opt => onSecret(opt), pickExtra: id => onCard(id), time: accept => onTime(accept),
    select: id => onCard(id), group: groupSelected, groups: () => Object.assign({}, groupOf), order: () => handOrder.slice(), isDealing: () => dealing,
    setSpeed: v => { settings.speed = v; save(); },
    closeModal, cardEl, skipAhead, waitingOnOthers,
    tr: x => L(x), log: x => logText(x),
    chat: t => sayChat(t), chatLog: () => chatLog.slice(), stats: () => Object.assign({}, stats), match: () => g.match, newMatch: onNewMatch,
    guests: () => net && net.guests ? Object.values(net.guests).map(x => ({ seat: x.seat, name: x.name, away: x.away, route: x.link ? x.link.kind : null })) : null,
    mode: () => mode, me: () => ME, net: () => net && { role: net.role, code: net.code, ready: net.ready, connected: net.connected, route: net.link ? net.link.kind : null, away: !!net.away, reconnecting: !!net.reconnecting, relayServers: net.relay ? net.relay.servers() : 0, direct: !!net.peer },
    dropLink: () => { const n = net; if (!n) return; if (n.link && n.link.direct) n.link.direct.close(); if (n.relay) { n.relay.close(); n.relay = null; } if (n.peer) { try { n.peer.destroy(); } catch (e) { /* ignore */ } n.peer = null; } n.link = null; if (n.role === 'guest') reconnect(n); },
    startLocal: (friend, seat) => { modal = 'friend'; renderModal(true); $('#friend-name').value = friend || 'Friend'; $('#friend-seat').value = String(seat || 2); startLocal(); },
    reveal: seat => reveal(seat), covered: () => covered(), promptSeat: () => promptSeat, stopFriend,
  };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ g, settings, order: { ids: handOrder, hand: orderHand }, ui: { selIds, pickExtra, modal } }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
