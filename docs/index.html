<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuajo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: a card table seen from above. Your partner sits across the top, the two opponents on
   the left and right, the stock / discard / sowee in the middle, and your own hand fanned along
   the bottom edge. One committed look: dark felt, ivory cards, gold accents (coins). */
:root {
  --felt: #1f4d40;
  --felt-deep: #12352a;
  --ivory: #f7f0df;
  --ivory-2: #e8dcc0;
  --ink: #2b2219;
  --fg: #f1eadb;
  --fg-dim: #c4b99f;
  --panel: #1a2925;
  --panel-2: #26382f;
  --line: rgba(255, 255, 255, 0.14);
  --accent: #e2b04f;
  --accent-ink: #2a1c05;
  --good: #8fd39a;
  --warn: #f0a35e;
  --bad: #e5736d;
  --oros: #b07f1a;
  --copas: #b32f2e;
  --espadas: #3a5a8c;
  --bastos: #4c7a35;
  --font-display: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body: 'Alegreya Sans', 'Gill Sans', 'Trebuchet MS', Verdana, sans-serif;
  --size: 1;
  --cw: calc(clamp(46px, 5.6vw, 74px) * var(--size));
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(ellipse at 50% 35%, var(--felt) 0%, var(--felt-deep) 78%) no-repeat, var(--felt-deep);
  color: var(--fg);
  font: 400 16px/1.4 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; }
#app { min-height: 100%; display: flex; flex-direction: column; gap: 10px; padding-inline: 16px; padding-block: 10px; max-width: 1360px; margin: 0 auto; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand h1 { font: 700 clamp(22px, 3vw, 30px)/1 var(--font-display); letter-spacing: 0.08em; margin: 0; color: var(--accent); }
.brand .sub { color: var(--fg-dim); font-size: 14px; }
.topbar .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.scores { display: flex; gap: 6px 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; font-size: 14px; }
.sc { display: inline-flex; gap: 6px; align-items: center; padding: 2px 9px; border-radius: 999px; background: rgba(0, 0, 0, 0.25); }
.sc .nm { font-weight: 600; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.us { background: var(--accent); }
.dot.them { background: var(--copas); }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* buttons */
.btn { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); cursor: pointer; font-weight: 600; font-size: 15px; line-height: 1.2; }
.btn:hover { background: #2f4439; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { background: #f0c268; }
.btn.danger { background: #5a2523; border-color: transparent; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:disabled:hover { background: var(--panel-2); }
.btn.primary:disabled:hover { background: var(--accent); }
.btn:focus-visible, .card.pick:focus-visible, .pile.clickable .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn .mini-row { --cw: 22px; margin-left: 6px; vertical-align: middle; }

/* table grid */
.table { flex: 1 1 auto; display: grid; grid-template-columns: minmax(120px, 1fr) minmax(0, 4fr) minmax(120px, 1fr); grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "north north north" "west center east"; gap: 10px; }
.seat-north { grid-area: north; }
.seat-west { grid-area: west; }
.seat-east { grid-area: east; }
.center { grid-area: center; }

/* opponents' seats */
.seat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 12px; border: 1px solid transparent; min-width: 0; }
.seat.active, .you.active { border-color: rgba(226, 176, 79, 0.65); background: rgba(0, 0, 0, 0.2); }
.seat header, .you header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 14px; color: var(--fg-dim); }
.seat .nm, .you .nm { font-weight: 700; font-size: 16px; color: var(--fg); }
.tag { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; background: rgba(0, 0, 0, 0.3); color: var(--fg-dim); line-height: 1.2; }
.tag.dealer { background: var(--accent); color: var(--accent-ink); }
.tag.purro { background: var(--copas); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
.tag.us { color: var(--accent); }
.fan { display: flex; justify-content: center; flex-wrap: wrap; --cw: 34px; max-width: 100%; padding-left: calc(var(--cw) * 0.7); }
.fan .card { margin-left: calc(var(--cw) * -0.7); }
.fan.open { --cw: 40px; padding-left: calc(var(--cw) * 0.45); }
.fan.open .card { margin-left: calc(var(--cw) * -0.45); }
.seat-west .fan, .seat-east .fan { --cw: 30px; }
.extras { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: flex-end; }
.secret, .marker { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--fg-dim); text-transform: uppercase; letter-spacing: 0.08em; }
.stack { display: flex; --cw: 26px; padding-left: calc(var(--cw) * 0.55); }
.stack .card { margin-left: calc(var(--cw) * -0.55); }
.marker { --cw: 30px; }
.stack .card.extra { margin-left: 5px; outline: 2px dashed var(--warn); outline-offset: -2px; }
.tag.penalty { background: #5a3a12; color: #f6d9a0; }

/* centre */
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; min-width: 0; padding: 6px 0; }
.piles { display: flex; gap: clamp(14px, 3vw, 40px); align-items: flex-end; justify-content: center; }
.pile { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
.pile .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); }
.slot { width: var(--cw); height: calc(var(--cw) * 1.55); border-radius: calc(var(--cw) * 0.09); border: 2px dashed rgba(255, 255, 255, 0.25); }
.pile .cnt { position: absolute; top: -9px; right: -10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; padding: 1px 7px; font-variant-numeric: tabular-nums; z-index: 1; }
.pile.clickable .card { cursor: pointer; box-shadow: 0 0 0 2px var(--accent), 0 6px 14px rgba(0, 0, 0, 0.4); transition: transform 0.15s ease; }
.pile.clickable .card:hover { transform: translateY(-5px); }
.pile.wins .card { box-shadow: 0 0 0 2px var(--good), 0 0 18px var(--good); }
.status { margin: 0; text-align: center; font-size: 17px; max-width: 60ch; text-wrap: balance; min-height: 1.4em; }
.status strong { color: var(--accent); }
.notice { color: var(--warn); }
.log { list-style: none; margin: 0; padding: 0; font-size: 13px; color: var(--fg-dim); max-width: 62ch; width: 100%; }
.log li { padding: 2px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); display: flex; gap: 6px; align-items: center; }
.log li:first-child { border-top: 0; }
.log li.purro, .log li.time, .log li.over, .log li.secret { color: var(--fg); }
.shown-card { --cw: 22px; display: inline-flex; vertical-align: middle; }

/* your seat */
.you { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 10px 8px 8px; border-radius: 14px; background: rgba(0, 0, 0, 0.16); border: 1px solid transparent; }
.hand { position: relative; display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; padding: 16px 0 8px; gap: 16px 12px; min-height: calc(var(--cw) * 1.55 + 22px); }
.hand .card { margin-left: calc(var(--cw) * -0.36); transition: transform 0.15s ease, box-shadow 0.15s ease; }
.hand .card.pick { cursor: pointer; }
.hand .card.pick:hover, .hand .card.pick:focus-visible { transform: translateY(-8px); z-index: 2; }
.hand .card.selected { transform: translateY(-16px); box-shadow: 0 0 0 2px var(--accent), 0 8px 18px rgba(0, 0, 0, 0.45); z-index: 3; }
.hand .card.drawn { box-shadow: 0 0 0 2px var(--good), 0 4px 12px rgba(0, 0, 0, 0.4); }

.hand .card.meld::after, .hand .card.part::after { content: ''; position: absolute; left: 20%; right: 20%; bottom: 0; height: 4px; border-radius: 3px 3px 0 0; background: var(--good); }
.hand .card.part::after { background: var(--warn); }
.hand-tools { display: flex; gap: 6px 8px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 13px; }
.hand-tools .lbl { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-dim); }
.btn.chip { padding: 4px 11px; font-size: 13px; border-radius: 999px; font-weight: 600; }
.btn.chip.on { border-color: rgba(226, 176, 79, 0.7); color: var(--accent); }
.drag-hint { color: var(--fg-dim); }
.hand .card { cursor: grab; touch-action: manipulation; -webkit-touch-callout: none; }
.hand .card.pick { cursor: pointer; }
.hand .card.placeholder { opacity: 0.3; transform: none !important; box-shadow: 0 0 0 2px var(--accent); }
.card.ghost { position: fixed; left: 0; top: 0; margin: 0; z-index: 60; pointer-events: none; transform: rotate(-3deg) scale(1.08); transition: none; box-shadow: 0 16px 30px rgba(0, 0, 0, 0.55), 0 0 0 2px var(--accent); }
body.dragging, body.dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }
body.dragging .hand .card:hover { transform: none; }
.pile.discard.drop-target > :first-child { outline: 2px dashed var(--accent); outline-offset: 5px; }
.pile.discard.drop-hover > :first-child { outline: 3px solid var(--good); outline-offset: 5px; transform: scale(1.06); }
.hint { text-align: center; font-size: 14px; color: var(--fg-dim); min-height: 1.4em; display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; }
.mini-row { display: inline-flex; gap: 3px; --cw: 26px; vertical-align: middle; flex-wrap: wrap; }
.bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }

/* cards */
.card { position: relative; width: var(--cw); height: calc(var(--cw) * 1.55); border-radius: calc(var(--cw) * 0.09); background: linear-gradient(160deg, #fbf7ee 0%, #f1e9d6 100%); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(60, 40, 20, 0.35); flex: 0 0 auto; user-select: none; -webkit-user-select: none; overflow: hidden; }
.card.s-coins { --suit: var(--oros); }
.card.s-cups { --suit: var(--copas); }
.card.s-swords { --suit: var(--espadas); }
.card.s-batons { --suit: var(--bastos); }
.card .face { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.face .ix { font-family: var(--font-display); font-weight: 700; font-size: 21px; fill: #2a2118; }
.face .ix.big { font-size: 46px; }
.face .tiny { font-family: var(--font-display); font-weight: 700; font-size: 6.5px; letter-spacing: 1.2px; fill: #2a2118; }
.card.back { background: repeating-linear-gradient(45deg, #8a2a2e 0 4px, #6d1c20 4px 8px), #6d1c20; border: calc(var(--cw) * 0.07) solid var(--ivory); }
.card.back::after { content: ''; position: absolute; inset: 10%; border: 1px solid rgba(255, 255, 255, 0.35); border-radius: 3px; }
.card.bounit { box-shadow: 0 0 0 2px var(--good), 0 0 12px var(--good); }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(5, 12, 10, 0.64); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; max-width: 700px; width: 100%; max-height: min(92vh, 100%); overflow: auto; padding: 22px 22px 18px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
.modal h2 { font: 700 24px/1.15 var(--font-display); margin: 0 0 6px; color: var(--accent); letter-spacing: 0.04em; text-wrap: balance; }
.modal h3 { margin: 18px 0 6px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-dim); font-size: 13px; font-weight: 700; }
.modal p { margin: 6px 0; max-width: 68ch; }
.modal .box > .bar { margin-top: 18px; justify-content: flex-end; }
.groups { display: flex; flex-wrap: wrap; gap: 10px; }
.group { display: flex; gap: 3px; padding: 6px; border-radius: 8px; background: rgba(0, 0, 0, 0.28); --cw: 40px; align-items: center; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 5px 16px; font-size: 15px; margin: 0; }
.kv dt { color: var(--fg-dim); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.rules { font-size: 15px; line-height: 1.5; }
.rules ul, .rules ol { padding-left: 20px; }
.rules li { margin: 3px 0; max-width: 68ch; }
.rules dl { margin: 6px 0; }
.rules dt { font-weight: 700; margin-top: 8px; }
.rules dd { margin: 0; max-width: 68ch; }
.rules table { border-collapse: collapse; font-variant-numeric: tabular-nums; margin: 6px 0; }
.rules th, .rules td { text-align: left; padding: 4px 12px 4px 0; border-bottom: 1px solid var(--line); }
.rules a { color: var(--accent); }
.settings .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
.settings .row:first-of-type { border-top: 0; }
.settings input[type=text], .settings select { font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.settings input[type=text] { width: 11em; }
.settings input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); }
.time-card { display: flex; align-items: center; gap: 14px; margin: 10px 0; }
.time-card .card { --cw: 64px; }

@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

@media (max-width: 760px) {
  .table { grid-template-columns: 1fr 1fr; grid-template-areas: "north north" "west east" "center center"; gap: 6px; }
  .seat-west .fan, .seat-east .fan { display: none; }
  .seat { padding: 6px 4px; }
  .status { font-size: 15px; }
  .hand { padding-top: 10px; }
  .brand .sub { display: none; }
}
@media (max-width: 460px) {
  :root { --cw: calc(44px * var(--size)); }
  .seat-north .fan { --cw: 26px; }
  .modal .box { padding: 16px 14px 14px; }
}

/* groups in your hand */
.seg { position: relative; display: flex; flex-wrap: wrap; padding-left: calc(var(--cw) * 0.36); row-gap: 16px; }
.seg.grp { padding: 24px 8px 8px calc(var(--cw) * 0.36 + 8px); border-radius: 12px; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); }
.seg.grp.ok { border-color: rgba(143, 211, 154, 0.6); background: rgba(143, 211, 154, 0.1); }
.seg.grp.part { border-color: rgba(240, 163, 94, 0.55); background: rgba(240, 163, 94, 0.07); }
.grp-tag { position: absolute; top: 3px; left: 8px; right: 4px; display: flex; white-space: nowrap; overflow: hidden; align-items: center; justify-content: space-between; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-dim); cursor: grab; -webkit-user-select: none; user-select: none; }
.grp-name { overflow: hidden; text-overflow: ellipsis; }
.seg.grp.ok .grp-name { color: var(--good); }
.seg.grp.part .grp-name { color: var(--warn); }
.grp-x { border: 0; background: transparent; color: var(--fg-dim); font-size: 17px; line-height: 1; padding: 0 4px; cursor: pointer; border-radius: 4px; }
.grp-x:hover, .grp-x:focus-visible { color: var(--fg); background: rgba(255, 255, 255, 0.12); }
.seg.grp .card.selected { transform: translateY(-10px); }
.seg.placeholder { opacity: 0.35; }
.seg.ghost { position: fixed; left: 0; top: 0; margin: 0; z-index: 60; pointer-events: none; transform: rotate(-2deg) scale(1.03); background: var(--panel-2); box-shadow: 0 16px 30px rgba(0, 0, 0, 0.5); }
.btn.chip.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

/* watching the other players */
.card.flying { position: fixed; left: 0; top: 0; margin: 0; z-index: 70; pointer-events: none; transform-origin: 0 0; box-shadow: 0 10px 22px rgba(0, 0, 0, 0.45); }
#app.dealing .fan .card, #app.dealing #hand .card, #app.dealing .pile.sowee .card, #app.dealing .pile.discard .card { visibility: hidden; }
.thinking { display: inline-flex; gap: 3px; align-items: center; padding: 0 2px; }
.thinking i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.1s infinite ease-in-out; }
.thinking i:nth-child(2) { animation-delay: 0.18s; }
.thinking i:nth-child(3) { animation-delay: 0.36s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.bubble { position: absolute; left: 50%; top: 0; transform: translate(-50%, -70%); background: var(--ivory); color: var(--ink); font: 700 17px/1 var(--font-display); letter-spacing: 0.04em; padding: 8px 14px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); z-index: 30; white-space: nowrap; pointer-events: none; animation: pop 0.28s cubic-bezier(0.3, 1.6, 0.5, 1); }
.bubble::after { content: ''; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: var(--ivory); }
@keyframes pop { from { transform: translate(-50%, -40%) scale(0.6); opacity: 0; } to { transform: translate(-50%, -70%) scale(1); opacity: 1; } }
.btn.next { display: inline-flex; align-items: center; gap: 6px; }
.btn.next kbd { font: 600 11px/1 var(--font-body); padding: 2px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--fg-dim); }

.center-bar { display: flex; justify-content: center; min-height: 38px; }

/* playing with a friend */
.friend .join-code { font: 700 34px/1 var(--font-display); letter-spacing: 0.25em; text-align: center; color: var(--accent); padding: 10px 0 4px; }
.link-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.link-row input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel-2); color: var(--fg); }
.friend .wait { display: flex; gap: 8px; align-items: center; color: var(--fg-dim); }
.error { color: var(--bad); }
.handover { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 8px; text-align: center; width: 100%; }
.handover p { margin: 0; font-size: 17px; max-width: 40ch; }
.tag.friend { background: rgba(143, 211, 154, 0.2); color: var(--good); }

/* phones: the whole table on one screen */
@media (max-width: 600px) {
  #app { gap: 6px; padding-block: 6px; }
  .topbar { gap: 6px 8px; }
  .brand h1 { font-size: 20px; }
  .topbar .actions { gap: 5px; }
  .topbar .btn { padding: 5px 9px; font-size: 13px; }
  .scores { order: 3; width: 100%; gap: 4px; font-size: 12px; }
  .sc { padding: 1px 7px; gap: 4px; }
  .table { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-areas: "west north east" "center center center"; gap: 4px; }
  .seat { padding: 4px 2px; gap: 3px; }
  .seat .fan { display: none; }
  .seat header { gap: 3px 5px; font-size: 12px; }
  .seat .nm { font-size: 14px; }
  .seat .tag.role:not(.us) { display: none; }
  .tag { font-size: 10px; padding: 1px 4px; }
  .extras { gap: 4px; }
  .center { gap: 6px; padding: 2px 0; }
  .piles { gap: 14px; }
  .pile .lbl { font-size: 10px; }
  .status { font-size: 14px; min-height: 0; }
  .center-bar { min-height: 0; }
  .btn.next { padding: 5px 12px; font-size: 13px; }
  .log { font-size: 12px; }
  .log li:nth-child(n+3) { display: none; }
  .you { padding: 6px 4px; gap: 4px; }
  .you header { font-size: 13px; gap: 4px 6px; }
  .hand-tools { gap: 4px 5px; }
  .hand-tools .lbl, .drag-hint { display: none; }
  .btn.chip { padding: 3px 9px; font-size: 12px; }
  .hand { --cw: calc(min(13.2vw, 54px) * var(--size)); padding-top: 12px; gap: 12px 8px; min-height: 0; }
  .seg { row-gap: 12px; }
  .seg.grp { padding: 20px 5px 5px calc(var(--cw) * 0.36 + 5px); }
  .hint { font-size: 12.5px; min-height: 0; }
  .bar .btn { padding: 7px 12px; font-size: 14px; }
  .bubble { font-size: 15px; padding: 6px 10px; }
}

/* table and card-back choices */
html[data-felt="blue"] { --felt: #1d4466; --felt-deep: #10283f; }
html[data-felt="burgundy"] { --felt: #5e2130; --felt-deep: #37111b; }
html[data-felt="wood"] { --felt: #7a5431; --felt-deep: #3e2915; }

<script>
/* Cuajo engine — rules, hand evaluation and AI. No DOM.
   Loads in the browser as window.Cuajo and in Node via require().
   Rules follow the description at https://www.pagat.com/rummy/cuajo.html */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Cuajo = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  // ---------- Cards ----------
  // 4 Spanish suits x 7 ranks (A,3,4,5,J,H,K) x 4 identical copies = 112 cards.
  const SUITS = ['coins', 'cups', 'swords', 'batons'];
  const SUIT_LABEL = ['Coins', 'Cups', 'Swords', 'Batons'];
  const SUIT_ES = ['Oros', 'Copas', 'Espadas', 'Bastos'];
  const RANKS = ['A', '3', '4', '5', 'J', 'H', 'K'];
  const RANK_LABEL = ['Ace', 'Three', 'Four', 'Five', 'Jack', 'Horse', 'King'];
  const RANK_ES = ['As', 'Tres', 'Cuatro', 'Cinco', 'Sota', 'Caballo', 'Rey'];
  const ACE = 0, KING = 6, NTYPES = 28, NCARDS = 112, HAND = 16;
  const SECRET_PAY = 50; // centavos paid by each opponent for a secret

  function typeOf(s, r) { return s * 7 + r; }
  function suitOf(t) { return (t / 7) | 0; }
  function rankOf(t) { return t % 7; }
  function cardType(id) { return (id / 4) | 0; }      // copies of type t are ids 4t..4t+3
  function isKingType(t) { return rankOf(t) === KING; }
  function isKing(id) { return isKingType(cardType(id)); }
  function cardName(t) { return RANK_LABEL[rankOf(t)] + ' of ' + SUIT_LABEL[suitOf(t)]; }
  function partnerOf(seat) { return (seat + 2) % 4; }
  function opponentsOf(seat) { return [0, 1, 2, 3].filter(p => p !== seat && p !== partnerOf(seat)); }
  let CURRENCY = '\u20B1';
  /** The money symbol shown in amounts (pesos by default). */
  function setCurrency(sym) { CURRENCY = sym || '\u20B1'; }
  function money(cents) {
    const v = Math.abs(cents);
    return (cents < 0 ? '\u2212' : '') + CURRENCY + (v / 100).toFixed(2);
  }
  function countsOf(ids) { const c = new Array(NTYPES).fill(0); for (const id of ids) c[cardType(id)]++; return c; }
  function sum(c) { let n = 0; for (let i = 0; i < c.length; i++) n += c[i]; return n; }
  function assert(cond, msg) { if (!cond) throw new Error('Cuajo: ' + (msg || 'illegal action')); }

  // ---------- Combination logic ----------
  // Valid combinations: set of 3 or 4 cards of one rank in different suits; run of 3-4-5 or
  // J-H-K in one suit; secret = 4 identical cards; a king on its own.

  // Memo keys: counts packed base-6 into two numbers (types 0-13 -> lo, 14-27 -> hi), updated incrementally.
  const P6 = []; for (let i = 0; i < 14; i++) P6.push(Math.pow(6, i));
  function packLo(c) { let v = 0; for (let i = 0; i < 14; i++) v += c[i] * P6[i]; return v; }
  function packHi(c) { let v = 0; for (let i = 0; i < 14; i++) v += c[i + 14] * P6[i]; return v; }

  const partMemo = new Map(); let partSize = 0;
  /** True if every card in `counts` (28 ints) can be arranged into valid combinations. */
  function canPartition(counts) {
    const c = counts.slice();
    let lo = packLo(c), hi = packHi(c);
    const dec = t => { c[t]--; if (t < 14) lo -= P6[t]; else hi -= P6[t - 14]; };
    const inc = t => { c[t]++; if (t < 14) lo += P6[t]; else hi += P6[t - 14]; };
    function rec(from) {
      let t = from; while (t < NTYPES && c[t] === 0) t++;
      if (t === NTYPES) return true;
      let m = partMemo.get(lo); if (!m) { m = new Map(); partMemo.set(lo, m); }
      const hit = m.get(hi); if (hit !== undefined) return hit;
      let ok = false;
      const s = suitOf(t), r = rankOf(t);
      if (r === KING) { dec(t); ok = rec(t); inc(t); }
      if (!ok && c[t] >= 4) { dec(t); dec(t); dec(t); dec(t); ok = rec(t); inc(t); inc(t); inc(t); inc(t); }
      if (!ok) {
        const o = [];
        for (let s2 = 0; s2 < 4; s2++) if (s2 !== s && c[typeOf(s2, r)] > 0) o.push(typeOf(s2, r));
        for (let i = 0; i < o.length && !ok; i++) for (let j = i + 1; j < o.length && !ok; j++) {
          dec(t); dec(o[i]); dec(o[j]);
          ok = rec(t);
          if (!ok && o.length === 3) { const q = o[3 - i - j]; dec(q); ok = rec(t); inc(q); }
          inc(o[j]); inc(o[i]); inc(t);
        }

      if (!ok && (r === 1 || r === 4) && c[t + 1] > 0 && c[t + 2] > 0) {
        dec(t); dec(t + 1); dec(t + 2); ok = rec(t); inc(t + 2); inc(t + 1); inc(t);
      }
      if (++partSize > 400000) { partMemo.clear(); partSize = 0; m = new Map(); partMemo.set(lo, m); }
      m.set(hi, ok);
      return ok;
    }
    return rec(0);
  }

  /** One valid arrangement of the cards as groups [{types, kind}], or null. */
  function partition(counts) {
    const c = counts.slice();
    function rec(from) {
      let t = from; while (t < NTYPES && c[t] === 0) t++;
      if (t === NTYPES) return [];
      if (!canPartition(c)) return null;
      const s = suitOf(t), r = rankOf(t);
      const attempt = (types, kind) => {
        for (const x of types) c[x]--;
        const sub = rec(t);
        for (const x of types) c[x]++;

      };
      let res = null;
      if (r === KING) res = attempt([t], 'king');
      if (!res && c[t] >= 4) res = attempt([t, t, t, t], 'secret');
      if (!res) {
        const o = [];
        for (let s2 = 0; s2 < 4; s2++) if (s2 !== s && c[typeOf(s2, r)] > 0) o.push(typeOf(s2, r));
        if (o.length === 3) res = attempt([t, o[0], o[1], o[2]], 'set');
        for (let i = 0; i < o.length && !res; i++) for (let j = i + 1; j < o.length && !res; j++) res = attempt([t, o[i], o[j]], 'set');
      }
      if (!res && (r === 1 || r === 4) && c[t + 1] > 0 && c[t + 2] > 0) res = attempt([t, t + 1, t + 2], 'run');
      return res;
    }
    return rec(0);
  }

  // Options for using the first remaining card `t` of a hand when planning toward a complete hand.
  // kept = cards from the hand this group keeps; used = slots of the final 16 it will occupy.
  function optionsAt(c, t) {
    const s = suitOf(t), r = rankOf(t);
    const ops = [];
    const o = [];
    for (let s2 = 0; s2 < 4; s2++) if (s2 !== s && c[typeOf(s2, r)] > 0) o.push(typeOf(s2, r));
    // complete groups
    if (r === KING) ops.push({ types: [t], used: 1, kind: 'king' });
    if (c[t] >= 4) ops.push({ types: [t, t, t, t], used: 4, kind: 'secret' });
    if (o.length === 3) ops.push({ types: [t, o[0], o[1], o[2]], used: 4, kind: 'set' });
    for (let i = 0; i < o.length; i++) for (let j = i + 1; j < o.length; j++) ops.push({ types: [t, o[i], o[j]], used: 3, kind: 'set' });
    if ((r === 1 || r === 4) && c[t + 1] > 0 && c[t + 2] > 0) ops.push({ types: [t, t + 1, t + 2], used: 3, kind: 'run' });
    // partial groups (one card short)
    if (c[t] >= 3) ops.push({ types: [t, t, t], used: 4, kind: 'secret3' });
    for (let i = 0; i < o.length; i++) ops.push({ types: [t, o[i]], used: 3, kind: 'set2' });
    if (r === 1 || r === 2 || r === 4 || r === 5) {
      const top = r <= 3 ? 3 : 6;
      for (let r2 = r + 1; r2 <= top; r2++) if (c[typeOf(s, r2)] > 0) ops.push({ types: [t, typeOf(s, r2)], used: 3, kind: 'run2' });
    }
    if (c[t] >= 2) ops.push({ types: [t, t], used: 4, kind: 'secret2' });
    // a single card kept as the start of a future set/run
    if (r !== KING) ops.push({ types: [t], used: 3, kind: 'seed' });
    // give the card up
    ops.push({ types: [t], used: 0, kind: 'drop', kept: 0 });
    for (const op of ops) if (op.kept === undefined) op.kept = op.types.length;
    return ops;
  }

  const keepMemo = new Map(); let keepSize = 0;
  /** Max number of cards of the hand that can be part of a complete hand using at most `slots` of its 16 places.
      Same option set as optionsAt(), written out inline for speed. */
  function bestKeep(counts, slots) {
    const c = counts.slice();
    let lo = packLo(c), hi = packHi(c);
    const dec = t => { c[t]--; if (t < 14) lo -= P6[t]; else hi -= P6[t - 14]; };
    const inc = t => { c[t]++; if (t < 14) lo += P6[t]; else hi += P6[t - 14]; };
    function rec(from, sl) {
      let t = from; while (t < NTYPES && c[t] === 0) t++;
      if (t === NTYPES || sl === 0) return 0;
      let m = keepMemo.get(lo); if (!m) { m = new Map(); keepMemo.set(lo, m); }
      const k = hi * 17 + sl;
      const hit = m.get(k); if (hit !== undefined) return hit;
      const s = suitOf(t), r = rankOf(t);
      let best, v;
      dec(t); best = rec(t, sl); inc(t);                                              // drop
      if (r === KING) { dec(t); v = 1 + rec(t, sl - 1); inc(t); if (v > best) best = v; }   // lone king
      else if (sl >= 3) { dec(t); v = 1 + rec(t, sl - 3); inc(t); if (v > best) best = v; } // seed
      if (sl >= 4) {                                                                   // toward a secret
        if (c[t] >= 2) { dec(t); dec(t); v = 2 + rec(t, sl - 4); inc(t); inc(t); if (v > best) best = v; }
        if (c[t] >= 3) { dec(t); dec(t); dec(t); v = 3 + rec(t, sl - 4); inc(t); inc(t); inc(t); if (v > best) best = v; }
        if (c[t] >= 4) { dec(t); dec(t); dec(t); dec(t); v = 4 + rec(t, sl - 4); inc(t); inc(t); inc(t); inc(t); if (v > best) best = v; }
      }
      if (sl >= 3) {
        let o0 = -1, o1 = -1, o2 = -1, no = 0;
        for (let s2 = 0; s2 < 4; s2++) if (s2 !== s) { const u = typeOf(s2, r); if (c[u] > 0) { if (no === 0) o0 = u; else if (no === 1) o1 = u; else o2 = u; no++; } }
        for (let i = 0; i < no; i++) {
          const a = i === 0 ? o0 : i === 1 ? o1 : o2;
          dec(t); dec(a); v = 2 + rec(t, sl - 3); inc(a); inc(t); if (v > best) best = v;            // set of 2
          for (let j = i + 1; j < no; j++) {
            const b = j === 1 ? o1 : o2;
            dec(t); dec(a); dec(b); v = 3 + rec(t, sl - 3); inc(b); inc(a); inc(t); if (v > best) best = v; // set of 3
          }
        }
        if (no === 3 && sl >= 4) { dec(t); dec(o0); dec(o1); dec(o2); v = 4 + rec(t, sl - 4); inc(o2); inc(o1); inc(o0); inc(t); if (v > best) best = v; }
        if (r === 1 || r === 2 || r === 4 || r === 5) {                                             // runs
          const top = r <= 3 ? 3 : 6;
          for (let r2 = r + 1; r2 <= top; r2++) { const u = typeOf(s, r2); if (c[u] > 0) { dec(t); dec(u); v = 2 + rec(t, sl - 3); inc(u); inc(t); if (v > best) best = v; } }
          if ((r === 1 || r === 4) && c[t + 1] > 0 && c[t + 2] > 0) { dec(t); dec(t + 1); dec(t + 2); v = 3 + rec(t, sl - 3); inc(t + 2); inc(t + 1); inc(t); if (v > best) best = v; }
        }

  }

  /** Cards still needed to complete the hand (a hand of slots-1 cards is 1 away when purro). */
  function distance(counts, slots) { return slots - bestKeep(counts, slots); }

  /** The grouping behind bestKeep: [{types, kind}] covering every card (kind 'drop' = not kept). */
  function keepPlan(counts, slots) {
    const c = counts.slice(); const groups = [];
    let from = 0, sl = slots;
    for (;;) {
      let t = from; while (t < NTYPES && c[t] === 0) t++;
      if (t === NTYPES) break;
      if (sl === 0) { for (let x = t; x < NTYPES; x++) for (let k = 0; k < c[x]; k++) groups.push({ types: [x], kind: 'drop' }); break; }
      const target = bestKeep(c, sl);
      let chosen = null;
      for (const op of optionsAt(c, t)) {
        if (op.used > sl) continue;
        for (const x of op.types) c[x]--;
        const v = op.kept + bestKeep(c, sl - op.used);
        for (const x of op.types) c[x]++;
        if (v === target) { chosen = op; break; }
      }
      for (const x of chosen.types) c[x]--;
      sl -= chosen.used;
      groups.push({ types: chosen.types.slice(), kind: chosen.kind });
      from = t;
    }
    return groups;
  }

  /** Cards still needed to complete the hand (a hand of slots-1 cards is 1 away when purro). */
  function distance(counts, slots) { return slots - bestKeep(counts, slots); }

  /** The grouping behind bestKeep: [{types, kind}] covering every card (kind 'drop' = not kept). */
  function keepPlan(counts, slots) {
    const c = counts.slice(); const groups = [];
    let from = 0, sl = slots;
    for (;;) {
      let t = from; while (t < NTYPES && c[t] === 0) t++;
      if (t === NTYPES) break;
      if (sl === 0) { for (let x = t; x < NTYPES; x++) for (let k = 0; k < c[x]; k++) groups.push({ types: [x], kind: 'drop' }); break; }
      const target = bestKeep(c, sl);
      let chosen = null;
      for (const op of optionsAt(c, t)) {
        if (op.used > sl) continue;
        for (const x of op.types) c[x]--;
        const v = op.kept + bestKeep(c, sl - op.used);
        for (const x of op.types) c[x]++;
        if (v === target) { chosen = op; break; }
      }
      for (const x of chosen.types) c[x]--;
      sl -= chosen.used;

      from = t;

    return groups;
  }

  /** Types that would complete a hand of slots-1 cards. Non-empty means the player is "purro". */
  function waitingTypes(counts, slots) {
    if (sum(counts) !== slots - 1) return [];
    const res = [];
    for (let t = 0; t < NTYPES; t++) { counts[t]++; if (canPartition(counts)) res.push(t); counts[t]--; }
    return res;
  }

  /** Types that bring a hand of slots-1 cards closer to completion. */
  function usefulTypes(counts, slots) {
    const base = bestKeep(counts, slots); const res = [];
    for (let t = 0; t < NTYPES; t++) { if (counts[t] >= 4) continue; counts[t]++; if (bestKeep(counts, slots) > base) res.push(t); counts[t]--; }
    return res;
  }

  /** Best distance reachable from a full hand (slots cards) by discarding one non-king card. */
  function bestDiscardDistance(c, slots) {
    let best = Infinity;
    for (let d = 0; d < NTYPES; d++) if (c[d] > 0 && !isKingType(d)) {
      c[d]--; const v = distance(c, slots); c[d]++;
      if (v < best) best = v;

    return best;
  }

  // ---------- Game state ----------
  function nextRand(g) { // mulberry32, state kept in g.rng so games are reproducible/serialisable
    g.rng = (g.rng + 0x6D2B79F5) >>> 0;
    let t = g.rng;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function randInt(g, n) { return Math.floor(nextRand(g) * n); }

  function log(g, msg, kind) { g.events.push({ msg, kind: kind || 'info', hand: g.handNo, n: g.events.length }); if (g.events.length > 80) g.events.splice(0, g.events.length - 80); }

  function newGame(opts) {
    opts = opts || {};
    const seed = opts.seed !== undefined ? opts.seed : ((Date.now() ^ (Math.random() * 0x7fffffff)) >>> 0);
    return {
      version: 2,
      rng: seed >>> 0, seed: seed >>> 0,
      names: (opts.names || ['You', 'East', 'North', 'West']).slice(),
      human: opts.human !== undefined ? opts.human : 0,
      humans: (opts.humans || [opts.human !== undefined ? opts.human : 0]).slice(),
      dealRule: opts.dealRule === 'right' ? 'right' : 'winner',
      balances: [0, 0, 0, 0], wins: [0, 0, 0, 0], handsPlayed: 0, draws: 0,
      dealer: opts.dealer || 0, nextDealer: opts.dealer || 0,
      handNo: 0, phase: 'idle', events: [],
      hands: [[], [], [], []], secrets: [[], [], [], []], stock: [], discards: [], discardedBy: [], history: [], seenIds: {},
      purro: [false, false, false, false], waiting: [[], [], [], []], marker: [null, null, null, null], penalty: [0, 0, 0, 0],
      sowee: null, seen: new Array(NTYPES).fill(0), turn: 0, turnCount: 0,
      drawn: null, drawnFrom: null, lastShown: null, timeOffer: null, result: null,

  }

  function startHand(g) {
    g.handNo++;
    const deck = []; for (let i = 0; i < NCARDS; i++) deck.push(i);
    for (let i = NCARDS - 1; i > 0; i--) { const j = randInt(g, i + 1); const tmp = deck[i]; deck[i] = deck[j]; deck[j] = tmp; }
    g.hands = [[], [], [], []]; g.secrets = [[], [], [], []];
    g.purro = [false, false, false, false]; g.waiting = [[], [], [], []]; g.marker = [null, null, null, null]; g.penalty = [0, 0, 0, 0];
    g.discards = []; g.discardedBy = []; g.history = []; g.seen = new Array(NTYPES).fill(0); g.seenIds = {};
    g.events = []; g.result = null; g.timeOffer = null; g.lastShown = null; g.drawn = null; g.drawnFrom = null;
    // Deal to the right (anticlockwise) starting with the dealer: dealer 16 cards, everyone else 15.
    for (let k = 0; k < 4; k++) {
      const seat = (g.dealer + k) % 4, n = seat === g.dealer ? HAND : HAND - 1;
      for (let i = 0; i < n; i++) g.hands[seat].push(deck.pop());
    }
    g.sowee = deck.pop(); markSeen(g, g.sowee);
    g.stock = deck; // top of the stock = last element
    g.turn = g.dealer; g.phase = 'discard'; g.turnCount = 0;
    log(g, 'Hand ' + g.handNo + ': ' + g.names[g.dealer] + ' deals. The sowee is the ' + cardName(cardType(g.sowee)) + '.', 'deal');
    if (isComplete(g, g.dealer)) finishWin(g, g.dealer, 'deal', null);
    return g;
  }

  function nextHand(g) { g.dealer = g.nextDealer; return startHand(g); }

  /** Record a card as publicly seen (sowee, discards, shown draws); counted once per card. */
  function markSeen(g, id) { if (!g.seenIds) g.seenIds = {}; if (!g.seenIds[id]) { g.seenIds[id] = true; g.seen[cardType(id)]++; } }
  function handCounts(g, seat) { return countsOf(g.hands[seat]); }
  /** Fourth cards laid face down with sowee secrets: out of the hand, but they still have to be melded to win. */
  function extrasOf(g, seat) { const r = []; for (const s of g.secrets[seat]) if (s.extra != null) r.push(s.extra); return r; }
  /** The cards that still have to form combinations: the concealed hand plus any sowee-secret extras. */
  function poolIds(g, seat) { return g.hands[seat].concat(extrasOf(g, seat)); }
  function poolCounts(g, seat) { return countsOf(poolIds(g, seat)); }
  /** How many of the 16 places are not yet filled by laid secrets (a four-card secret fills 4, a sowee secret 3). */
  function slotsFor(g, seat) { let n = HAND; for (const s of g.secrets[seat]) n -= s.kind === 'four' ? 4 : 3; return n; }
  function isComplete(g, seat) { return poolIds(g, seat).length === slotsFor(g, seat) && canPartition(poolCounts(g, seat)); }
  function completesWith(g, seat, t) {
    if (poolIds(g, seat).length + 1 !== slotsFor(g, seat)) return false;
    const c = poolCounts(g, seat); c[t]++; return canPartition(c);
  }
  function topDiscard(g) { return g.discards.length ? g.discards[g.discards.length - 1] : null; }
  function purroAmongOthers(g, seat) { for (let p = 0; p < 4; p++) if (p !== seat && g.purro[p]) return true; return false; }
  function currentClaimant(g) { return g.timeOffer ? g.timeOffer.claimants[g.timeOffer.index] : null; }
  /** A player whose purro was broken may not win (or announce purro) for two turns. */
  function mayWin(g, seat) { return g.penalty[seat] === 0; }

  /** What `seat` may do right now. */
  function legalActions(g, seat) {
    const a = { drawStock: false, takeDiscard: false, endHand: false, discard: false, secrets: [], timeClaim: false };
    if (g.phase === 'draw' && g.turn === seat) {
      const top = topDiscard(g);
      a.drawStock = g.stock.length > 0;
      a.takeDiscard = top != null && (g.stock.length > 0 || (mayWin(g, seat) && completesWith(g, seat, cardType(top))));
      a.endHand = g.stock.length === 0;
    } else if (g.phase === 'discard' && g.turn === seat) {
      a.discard = true;
      a.secrets = secretOptions(g, seat);
    } else if (g.phase === 'timeOffer' && currentClaimant(g) === seat) {
      a.timeClaim = true;
    }
    return a;
  }

  function drawStock(g, seat) {
    assert(g.phase === 'draw' && g.turn === seat, 'not your turn to draw');
    assert(g.stock.length > 0, 'the stock is empty');
    const id = g.stock.pop();
    g.hands[seat].push(id); g.drawn = id; g.drawnFrom = 'stock'; g.phase = 'discard';
    const shown = purroAmongOthers(g, seat) || g.penalty[seat] > 0;
    g.lastShown = shown ? { seat, id } : null;
    if (shown) { markSeen(g, id); log(g, g.names[seat] + ' draws the ' + cardName(cardType(id)) + ' and shows it' + (g.penalty[seat] > 0 ? ' (the turns after a broken purro)' : ' (someone is purro)') + '.', 'draw'); }
    else log(g, g.names[seat] + ' draws from the stock.', 'draw');
    if (mayWin(g, seat) && isComplete(g, seat)) { finishWin(g, seat, 'stock', id); return; }
    if (shown) {
      const t = cardType(id), claimants = [];
      for (let k = 1; k < 4; k++) { const p = (seat + k) % 4; if (g.purro[p] && g.waiting[p].indexOf(t) >= 0) claimants.push(p); }
      if (claimants.length) { g.phase = 'timeOffer'; g.timeOffer = { card: id, from: seat, claimants, index: 0 }; }
    }

  /** The current claimant of a shown card says "time" (accept) or lets it go. */
  function resolveTime(g, accept) {
    assert(g.phase === 'timeOffer' && g.timeOffer, 'no time claim pending');
    const o = g.timeOffer, p = o.claimants[o.index];
    if (accept) {
      const h = g.hands[o.from]; h.splice(h.indexOf(o.card), 1);
      g.hands[p].push(o.card); g.drawn = o.card; g.drawnFrom = 'time'; g.timeOffer = null;
      log(g, g.names[p] + ' says "time!" and claims the ' + cardName(cardType(o.card)) + '.', 'time');
      finishWin(g, p, 'time', o.card);
    } else {
      log(g, g.names[p] + ' lets the ' + cardName(cardType(o.card)) + ' go.', 'time');
      o.index++;
      if (o.index >= o.claimants.length) { g.timeOffer = null; g.phase = 'discard'; }

  function takeDiscard(g, seat) {
    assert(g.phase === 'draw' && g.turn === seat, 'not your turn to draw');
    const top = topDiscard(g);

    if (g.stock.length === 0) assert(mayWin(g, seat) && completesWith(g, seat, cardType(top)), 'with the stock empty the last discard may only be taken to win');
    const id = g.discards.pop(); g.discardedBy.pop();
    g.hands[seat].push(id); g.drawn = id; g.drawnFrom = 'discard'; g.phase = 'discard';

  /** Secrets `seat` could lay down now: four identical cards, or the three cards identical to the sowee plus any fourth card. */
  function secretOptions(g, seat) {

  function declareSecret(g, seat, type, extraId) {
    const opt = secretOptions(g, seat).filter(o => o.type === type)[0];

    log(g, g.names[seat] + ' lays down a secret' + (opt.kind === 'sowee' ? ' (the three cards matching the sowee, with a fourth card that still has to be melded)' : '') + ' and collects ' + money(SECRET_PAY) + ' from each opponent.', 'secret');

  function discard(g, seat, id) {
    assert(g.phase === 'discard' && g.turn === seat, 'not your turn to discard');
    const h = g.hands[seat], i = h.indexOf(id);

    assert(!isKing(id), 'kings may not be discarded');

  // ---------- Scoring ----------
  /** Do two other cards in `c` "go with" type t? A run in the same suit, or for an ace two other aces of different suits. */
  function goesWith(c, t) {
    const s = suitOf(t), r = rankOf(t);

    return true;
  }

  function finishWin(g, seat, source, bounitId) {
    const pool = poolCounts(g, seat);
    const groups = partition(pool) || [];
    const secretCards = []; for (const s of g.secrets[seat]) for (const id of s.cards) secretCards.push(id);
    const allIds = poolIds(g, seat).concat(secretCards);           // the winner's sixteen cards
    const all = countsOf(allIds);
    let kings = 0, kingsValue = 0;
    for (const id of allIds) { const t = cardType(id); if (isKingType(t)) { kings++; kingsValue += suitOf(t) === 0 ? 50 : 20; } }
    // porbis: no kings, or a single king that sits in a jack-horse-king run
    let porbis = kings === 0;
    if (kings === 1) {
      const kt = allIds.map(cardType).filter(isKingType)[0];
      if (pool[kt] === 1) {
        const s = suitOf(kt), J = typeOf(s, 4), H = typeOf(s, 5);
        if (pool[J] > 0 && pool[H] > 0) { const c2 = pool.slice(); c2[J]--; c2[H]--; c2[kt]--; if (canPartition(c2)) porbis = true; }
      }
    }

    const bt = bounitId != null ? cardType(bounitId) : null;
    const fromStock = source === 'stock' || source === 'deal';
    let cond1 = bt != null && goesWith(all, bt);
    let cond2 = all[sw] > 0 && goesWith(all, sw);
    // A bounit obtained from another player: if the conditions are not met from the hand, up to 15 extra
    // cards may be drawn from the stock to satisfy them (they need not be melded and add no king value).
    const extraDraws = [];
    if (!porbis && !fromStock && !(cond1 && cond2)) {

        const id = g.stock.pop(); extraDraws.push(id); all[cardType(id)]++;

        if (cond1 && cond2) break;
      }

    log(g, 'Cuajo! ' + g.names[seat] + ' wins and collects ' + money(per) + ' from each opponent' + (extraDraws.length ? ' after drawing ' + extraDraws.length + ' extra card' + (extraDraws.length === 1 ? '' : 's') + ' from the stock' : '') + '.', 'over');

  // ---------- AI ----------
  /** Best distance reachable from a full hand by discarding one non-king card; `avail` limits the discardable types. */
  function bestDiscardDistance(c, slots, avail) {
    avail = avail || c;

  // ---------- arranging your hand ----------
  function sortIds(ids, mode) {
    const t = C.cardType;

  /** Groups your hand the way the hint planner sees it: finished combinations, kings, then cards one short. */
  function autoGroupOrder() {

    const plan = C.keepPlan(C.poolCounts(g, ME), C.slotsFor(g, ME)).map((gp, i) => ({ gp, i }));
    plan.sort((x, y) => (pri[x.gp.kind] - pri[y.gp.kind]) || x.i - y.i);
    const left = g.hands[ME].slice().sort(byType), out = [], kings = [];
    let finished = 0;

      for (const ty of gp.types) { const k = left.findIndex(id => C.cardType(id) === ty); if (k >= 0) ids.push(left.splice(k, 1)[0]); }

      if (ids.length >= 2 && gp.kind !== 'seed' && gp.kind !== 'drop') { const gid = nextGid++; for (const id of ids) groupOf[id] = gid; }

  }
  /** Your hand in your own order, with each group's cards kept together; new cards go to the right end. */
  function orderedHand() {

    const inHand = new Set(hand), kept = handOrder.filter(id => inHand.has(id)), known = new Set(kept);
    const cmp = settings.sortMode === 'rank' ? (a, b) => (C.rankOf(C.cardType(a)) - C.rankOf(C.cardType(b))) || (C.suitOf(C.cardType(a)) - C.suitOf(C.cardType(b))) : byType;

    for (const k of Object.keys(groupOf)) if (size[groupOf[k]] < 2) delete groupOf[k];

    for (const id of kept) {
      if (done.has(id)) continue;
      const gid = groupOf[id];
      if (gid == null) { out.push(id); done.add(id); continue; }
      for (const x of kept) if (groupOf[x] === gid && !done.has(x)) { out.push(x); done.add(x); }

  function segmentsOf(order) {

  }
  function oneShort(c) { for (let t = 0; t < C.NTYPES; t++) { if (c[t] >= 4) continue; c[t]++; const ok = C.canPartition(c); c[t]--; if (ok) return true; } return false; }
  /** What a group of your cards amounts to, for its label. */
  function groupLabel(ids) {

      if (parts.every(x => x.kind === 'king')) return { cls: 'ok', text: parts.length === 1 ? 'King' : 'Kings' };
      if (parts.length === 1) return { cls: 'ok', text: { set: 'Set', run: 'Run', secret: 'Four alike' }[parts[0].kind] || 'Combination' };
      return { cls: 'ok', text: parts.length + ' combinations' };
    }
    if (oneShort(c)) return { cls: 'part', text: 'Needs 1', title: 'One more card makes this a combination' };

  function sortHand(mode) {

  function groupSelected() {

  function moveCard(id, dir) {

    ghost.removeAttribute('data-key'); ghost.removeAttribute('tabindex'); ghost.setAttribute('aria-hidden', 'true');

          cd.setAttribute('aria-label', label + ', card ' + (i + 1) + ' of ' + cards.length);
          cd.addEventListener('click', () => { if (!suppressClick) onCard(id); });
          if (discarding) cd.addEventListener('dblclick', () => { if (pickExtra == null && !C.isKing(id)) onDiscard(id); });
          cd.addEventListener('keydown', e => {
            if (e.shiftKey && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); moveCard(id, e.key === 'ArrowLeft' ? -1 : 1); return; }
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onCard(id); }
          });
          cd.addEventListener('pointerdown', e => onHandPointerDown(e, id, cd, 'card'));
          cd.addEventListener('contextmenu', e => { if (e.pointerType !== 'mouse' || COARSE) e.preventDefault(); });
          cd.addEventListener('dragstart', e => e.preventDefault());
          if (isSel) cd.classList.add('selected');
          if (id === g.drawn && g.turn === ME) cd.classList.add('drawn');
          if (marks[id] && sg.gid == null) cd.classList.add(marks[id]);
          box.append(cd);
        }
        hand.append(box);
      }
    }

    const hint = $('#hint'); hint.innerHTML = '';
    if (settings.hints && g.phase !== 'idle' && g.phase !== 'over' && g.phase !== 'timeOffer') {
      const a = C.analyze(g, ME), top = C.topDiscard(g);
      const takeIt = myTurn('draw') && top != null && g.stock.length && !completesMe(C.cardType(top)) && C.aiChooseDraw(g, ME) === 'discard';
      if (takeIt) hint.append('Hint: take the ' + C.cardName(C.cardType(top)) + ' from the discard pile. It brings you closer than a blind draw.');
      else if (a.n === a.slots) {
        if (a.complete) hint.append('Your hand is complete.');
        else if (a.bestDiscard) hint.append('Hint: discarding the ' + C.cardName(a.bestDiscard.type) + ' leaves you ' + plural(a.bestDiscard.distance, 'card') + ' from a complete hand.');
      } else if (a.n === a.slots - 1) {
        if (a.waiting.length) { hint.append('Purro! Any of these completes your hand: '); hint.append(miniRow(a.waiting)); }
        else { hint.append('You need ' + plural(a.distance, 'more card') + '. Useful draws: '); hint.append(miniRow(a.useful.slice(0, 12))); if (a.useful.length > 12) hint.append(' +' + (a.useful.length - 12) + ' more'); }
      }
    }

    const bar = $('#bar'); bar.innerHTML = '';
    if (dealing) { /* nothing to press while the cards go round */ }
    else if (g.phase === 'idle') bar.append(btn('Deal', deal, 'primary'));
    else if (g.phase === 'over') bar.append(btn('Show result', () => { modal = 'result'; render(); }), btn('Next hand', deal, 'primary'));
    else if (myTurn('draw')) {
      const top = C.topDiscard(g);
      if (g.stock.length) bar.append(btn('Draw from stock', onStock, top == null ? 'primary' : ''));
      if (top != null && C.legalActions(g, ME).takeDiscard) { const b = btn('Take the ' + C.cardName(C.cardType(top)), onTake, completesMe(C.cardType(top)) && g.penalty[ME] === 0 ? 'primary' : ''); bar.append(b); }
      if (!g.stock.length) bar.append(btn('End hand (stock empty)', onEnd));
    } else if (myTurn('discard')) {
      if (pickExtra != null) bar.append(btn('Cancel secret', () => { pickExtra = null; render(); }));
      else {
        const one = selIds.length === 1 ? selIds[0] : null;
        let label = 'Discard (select a card)', off = true;
        if (selIds.length > 1) label = 'Select one card to discard';
        else if (one != null && C.isKing(one)) label = 'Kings can\u2019t be discarded';
        else if (one != null) { label = 'Discard the ' + C.cardName(C.cardType(one)); off = false; }
        const db = btn(label, () => onDiscard(), 'primary', off); db.dataset.key = 'discard-btn';
        bar.append(db);
        for (const opt of C.secretOptions(g, ME)) {
          const label = opt.kind === 'four' ? 'Lay down secret: four ' + C.cardName(opt.type) : 'Lay down secret: three ' + C.cardName(opt.type) + ' (sowee) + one card';
          bar.append(btn(label, () => onSecret(opt)));
        }
      }
    }
  }

  /** Class per card id from the planner: complete groups 'meld', one-short groups 'part'. */
  function handMarks() {
    const marks = {};
    if (!settings.hints || g.phase === 'idle' || g.phase === 'over') return marks;
    const plan = C.keepPlan(C.poolCounts(g, ME), C.slotsFor(g, ME));
    const pool = g.hands[ME].slice().sort(byType).concat(C.extrasOf(g, ME));
    const complete = { king: 1, secret: 1, set: 1, run: 1 }, partial = { set2: 1, run2: 1, secret3: 1 };
    for (const gp of plan) {
      const cls = complete[gp.kind] ? 'meld' : partial[gp.kind] ? 'part' : null;
      for (const t of gp.types) {
        const i = pool.findIndex(id => C.cardType(id) === t);
        if (i < 0) continue;
        const id = pool.splice(i, 1)[0];
        if (cls) marks[id] = cls;
      }
    }
    return marks;
  }

  // ---------- modals ----------
  let modalKind = null;
  function renderModal(force) {
    const m = $('#modal');
    if (!modal) { m.hidden = true; m.innerHTML = ''; modalKind = null; return; }
    if (!force && modalKind === modal && m.firstElementChild && (modal === 'rules' || modal === 'settings' || modal === 'friend')) return; // keep typed text, scroll and focus
    const opening = modalKind !== modal;
    m.hidden = false; m.innerHTML = '';

    else if (modal === 'rules') box = rulesBox();
    else if (modal === 'friend') box = friendBox();

    box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true');
    const h2 = box.querySelector('h2'); if (h2) { h2.id = 'dialog-title-' + modal; box.setAttribute('aria-labelledby', h2.id); }
    m.append(box);
    m.onclick = e => { if (e.target === m && modal !== 'time') closeModal(); };
    modalKind = modal;
    if (opening) { const f = box.querySelector('.btn.primary') || box.querySelector('.btn'); if (f) setTimeout(() => { try { f.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }, 0); }

  // ---------- playing with a friend ----------
  // Online games connect the two browsers directly (PeerJS). The host's computer runs the game and
  // sends the guest only what that seat may see; the guest sends back its moves.
  let peerLoading = null;
  function loadPeerJs() {
    if (window.Peer) return Promise.resolve();
    if (!peerLoading) peerLoading = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
      s.onload = () => (window.Peer ? res() : rej(new Error('PeerJS missing')));
      s.onerror = () => { peerLoading = null; rej(new Error('PeerJS did not load')); };
      document.head.appendChild(s);
    });
    return peerLoading;
  }
  const WEB_NOTE = 'Online play works on the website version of the game (' + PAGES_URL + ') and in the downloaded file, but not inside the Claude preview.';
  function describePeerError(e) {
    const t = e && e.type;
    if (t === 'peer-unavailable') return 'No game found with that code. Check it with your friend, and make sure their game is still open.';
    if (t === 'browser-incompatible') return 'This browser cannot make online connections. Try Chrome, Edge, Firefox or Safari.';
    if (t === 'network' || t === 'server-error' || t === 'socket-error' || t === 'socket-closed') return 'Could not reach the connection service. ' + WEB_NOTE;
    return 'Connection problem (' + (t || 'unknown') + '). ' + WEB_NOTE;
  }
  function makeCode() {
    const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', a = new Uint32Array(5);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.from(a, x => A[x % A.length]).join('');
  }
  function joinLink(code) {
    const base = /^https?:$/.test(location.protocol) && location.hostname.indexOf('claude') < 0 ? location.origin + location.pathname : PAGES_URL;
    return base + '?join=' + code;
  }
  function send(msg) { if (net && net.conn && net.conn.open) { try { net.conn.send(msg); } catch (e) { console.error(e); } } }
  /** What the guest's seat is allowed to see: other hands, the stock and the shuffle stay hidden until the hand is over. */
  function viewFor(seat) {
    const v = JSON.parse(JSON.stringify(g)), over = g.phase === 'over';
    v.rng = 0; v.seed = 0;
    v.stock = g.stock.map(() => -1);
    for (let s = 0; s < 4; s++) {
      if (s === seat || over) continue;
      v.hands[s] = g.hands[s].map(id => (g.purro[s] && id === g.marker[s]) ? id : -1);
      v.secrets[s] = g.secrets[s].map(x => Object.assign({}, x, { cards: x.cards.map(() => -1), extra: x.extra != null ? -1 : null, type: x.kind === 'sowee' ? x.type : -1 }));
      v.waiting[s] = [];
    }
    if (!over && g.drawn != null && g.turn !== seat && g.drawnFrom === 'stock' && !(g.lastShown && g.lastShown.id === g.drawn)) v.drawn = null;
    return v;
  }
  function sendState() {
    const move = lastMove; lastMove = null;
    if (!net || net.role !== 'host' || !net.conn || !net.conn.open) return;
    const seat = net.friendSeat;
    const m = move && move.kind === 'draw' && move.src === 'stock' && !move.shown && move.seat !== seat ? Object.assign({}, move, { id: null }) : move;
    send({ t: 'state', view: viewFor(seat), move: m });
  }
  function myNameInput() {
    const n = (($('#friend-myname') || {}).value || '').trim().slice(0, 14);
    if (n) settings.names[0] = n;
    return settings.names[0];
  }
  function startLocal() {
    myNameInput();
    const seat = +(($('#friend-seat') || {}).value || 2);
    const friend = ((($('#friend-name') || {}).value || '').trim() || 'Friend').slice(0, 14);
    mode = 'local'; ME = 0; humanNames = {}; humanNames[seat] = friend;
    modal = null;
    newGame([0, seat]);
    deal();
  }
  async function hostOnline() {
    myNameInput(); save();
    const seat = +(($('#friend-seat') || {}).value || 2);
    friendUi.error = '';
    try { await loadPeerJs(); } catch (e) { friendUi.error = 'Could not load the online connection. ' + WEB_NOTE; renderModal(true); return; }
    openHost(seat, 0);
  }
  function openHost(seat, tries) {
    const code = makeCode(), peer = new window.Peer('cuajo-' + code);
    net = { role: 'host', peer, conn: null, code, friendSeat: seat, ready: false };
    renderModal(true);
    peer.on('open', () => { if (net && net.peer === peer) { net.ready = true; renderModal(true); } });
    peer.on('connection', conn => {
      if (!net || net.peer !== peer) return;
      if (net.conn) { conn.on('open', () => { conn.send({ t: 'full' }); setTimeout(() => conn.close(), 500); }); return; }
      net.conn = conn;
      conn.on('data', onHostData);
      conn.on('close', onFriendLeft);
    });
    peer.on('error', e => {
      if (!net || net.peer !== peer) return;
      if (e.type === 'unavailable-id' && tries < 3) { peer.destroy(); openHost(seat, tries + 1); return; }
      if (net.conn && mode === 'host') { console.warn(e); return; }   // the game connection itself is still fine
      friendUi.error = describePeerError(e); net = null; try { peer.destroy(); } catch (x) { /* ignore */ }
      renderModal(true);
    });
  }
  function onHostData(msg) {
    if (!msg || !net || net.role !== 'host') return;
    const seat = net.friendSeat;
    if (msg.t === 'hello') {
      mode = 'host'; if (ME !== 0) switchMe(0);
      const nm = String(msg.name || '').trim().slice(0, 14);
      humanNames = {}; humanNames[seat] = nm && nm !== 'You' ? nm : 'Friend';
      send({ t: 'welcome', seat, v: 1 });
      modal = null;
      newGame([0, seat]);             // a fresh scoreboard for the two of you
      deal();
      flash(humanNames[seat] + ' joined the game.');
      return;
    }
    if (msg.t === 'bye') { onFriendLeft(); return; }
    if (mode !== 'host') return;
    if (msg.t === 'skip') { skipAhead(); return; }
    if (msg.t !== 'act') return;
    try {
      if (msg.a === 'deal') { if (!dealing && (g.phase === 'over' || g.phase === 'idle')) deal(); return; }
      if (dealing) return;
      const la = C.legalActions(g, seat), a = msg.a, arg = msg.arg;
      const ok = a === 'drawStock' ? la.drawStock : a === 'takeDiscard' ? la.takeDiscard : a === 'endHand' ? la.endHand
        : a === 'discard' ? la.discard && g.hands[seat].indexOf(arg) >= 0 && !C.isKing(arg)
        : a === 'secret' ? la.discard && !!arg && la.secrets.some(o => o.type === arg.type)
        : a === 'time' ? la.timeClaim : false;
      if (!ok) { sendState(); return; }
      const r = act(seat, a, arg); announce(r.b); drive();
    } catch (e) { console.error(e); sendState(); }
  }
  function onFriendLeft() {
    if (!net || net.role !== 'host') return;
    const seat = net.friendSeat, nm = humanNames[seat] || 'Your friend', wasPlaying = mode === 'host';
    try { net.peer.destroy(); } catch (e) { /* ignore */ }
    net = null; mode = 'solo'; humanNames = {};
    if (g) { g.humans = [0]; applyNames(); C.setDifficulty(g, settings.difficulty); }
    if (wasPlaying) { flash(nm + ' left. A computer player takes over that seat.'); changed(); } else renderModal(true);
  }
  async function joinOnline() {
    myNameInput();
    const code = ((($('#join-code') || {}).value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''));
    friendUi.joinCode = code;
    if (code.length < 4) { friendUi.error = 'Type the game code your friend sent you.'; renderModal(true); return; }
    save();                          // keep your own game; it comes back when you leave
    friendUi.error = '';
    try { await loadPeerJs(); } catch (e) { friendUi.error = 'Could not load the online connection. ' + WEB_NOTE; renderModal(true); return; }
    const peer = new window.Peer();
    net = { role: 'guest', peer, conn: null, code, connected: false };
    renderModal(true);
    peer.on('open', () => {
      if (!net || net.peer !== peer) return;
      const conn = peer.connect('cuajo-' + code, { reliable: true });
      net.conn = conn;
      conn.on('open', () => conn.send({ t: 'hello', name: settings.names[0], v: 1 }));
      conn.on('data', onGuestData);
      conn.on('close', onHostLeft);
    });
    peer.on('error', e => {
      if (!net || net.peer !== peer) return;
      if (net.connected && mode === 'guest' && e.type !== 'peer-unavailable') { console.warn(e); return; }
      friendUi.error = describePeerError(e); net = null; try { peer.destroy(); } catch (x) { /* ignore */ }
      if (mode === 'guest') restoreSolo(); else renderModal(true);
    });
  }
  function onGuestData(msg) {
    if (!msg || !net || net.role !== 'guest') return;
    if (msg.t === 'welcome') {
      mode = 'guest'; ME = msg.seat; net.connected = true;
      selIds = []; groupOf = {}; handOrder = []; orderHand = 0; pickExtra = null; bubbles = {}; resultShown = false; modal = null;
      dealToken++; dealing = false; handHidden = false; promptSeat = null;
      render(); return;
    }
    if (msg.t === 'full') { friendUi.error = 'That game already has two players.'; try { net.peer.destroy(); } catch (e) { /* ignore */ } net = null; renderModal(true); return; }
    if (msg.t === 'bye') { onHostLeft(); return; }
    if (mode !== 'guest') return;
    if (msg.t === 'bubble') { showBubble(msg.seat, msg.text, msg.msec); return; }
    if (msg.t === 'state' && msg.view) applyRemote(msg.view, msg.move);
  }
  function applyRemote(view, move) {
    let from = null;
    if (move) {
      if (move.kind === 'draw') from = move.src === 'stock' ? rectOf('.pile.stock .card') : rectOf('.pile.discard .card');
      else if (move.kind === 'discard') from = cardRect(move.seat, move.id);
      else if (move.kind === 'time') from = seatTarget(move.from).rect;
    }
    const newHand = !g || g.handNo !== view.handNo;
    g = view;
    if (newHand || (move && move.kind === 'deal')) { selIds = []; groupOf = {}; pickExtra = null; resultShown = false; orderHand = 0; if (modal === 'result' || modal === 'time') modal = null; }
    if (move && move.kind === 'deal') { animateDeal(); return; }
    render();
    animateMove(move, from);
    drive();
  }
  function onHostLeft() {
    if (!net || net.role !== 'guest') return;
    const wasPlaying = mode === 'guest';
    try { net.peer.destroy(); } catch (e) { /* ignore */ }
    net = null;
    if (wasPlaying) { restoreSolo(); flash('The connection to the host ended. You are back in your own game.'); }
    else renderModal(true);
  }
  function restoreSolo() {
    mode = 'solo'; ME = 0; humanNames = {}; handHidden = false; promptSeat = null; layouts = {};
    const saved = load();
    g = saved && validGame(saved.g) ? saved.g : C.newGame({ names: settings.names, human: 0 });
    g.humans = [0]; applyNames(); C.setDifficulty(g, settings.difficulty);
    handOrder = []; orderHand = 0; groupOf = {}; selIds = []; pickExtra = null; bubbles = {};
    if (modal !== 'friend') modal = null;
    resultShown = g.phase === 'over'; dealToken++; dealing = false;
    render(); drive();
  }
  /** Back to one player against three computer players. */
  function stopFriend() {
    const wasGuest = mode === 'guest';
    if (net) { send({ t: 'bye' }); const p = net.peer; setTimeout(() => { try { p.destroy(); } catch (e) { /* ignore */ } }, 300); }
    net = null;
    if (wasGuest) { restoreSolo(); modal = null; render(); return; }
    mode = 'solo'; humanNames = {}; handHidden = false; promptSeat = null;
    if (g) { if (ME !== 0) switchMe(0); g.humans = [0]; applyNames(); C.setDifficulty(g, settings.difficulty); }
    layouts = {}; modal = null; changed();
  }
  function cancelOnline() {
    if (net) { const p = net.peer; net = null; try { p.destroy(); } catch (e) { /* ignore */ } }
    friendUi.error = ''; renderModal(true);
  }
  function modeLabel() {
    const friend = Object.keys(humanNames).map(k => humanNames[k])[0] || (mode === 'guest' ? name(0) : 'your friend');
    if (mode === 'local') return 'Pass-and-play with ' + friend;
    if (mode === 'host') return 'Online with ' + friend;
    if (mode === 'guest') return 'Online in ' + name(0) + '’s game';
    return 'Play with a friend';
  }
  function friendBox() {
    const box = el('div', 'box friend');
    box.append(el('h2', null, 'Play with a friend'));
    if (mode !== 'solo') {
      const who = mode === 'guest' ? 'You joined ' + name(0) + '’s game as ' + (C.partnerOf(ME) === 0 ? 'their partner.' : 'their opponent.')
        : mode === 'host' ? humanNames[Object.keys(humanNames)[0]] + ' is playing online as your ' + (isHuman(2) ? 'partner.' : 'opponent.')
        : 'You are sharing this computer with ' + humanNames[Object.keys(humanNames)[0]] + '.';
      box.append(el('p', null, who));
      box.append(barWith(btn('Back to playing alone', stopFriend, 'danger'), btn('Close', closeModal, 'primary')));
      return box;
    }
    if (net && net.role === 'host') {
      box.append(el('p', null, 'Send your friend this code or link. The game starts as soon as they join.'));
      const code = el('div', 'join-code', net.ready ? net.code : '…'); box.append(code);
      if (net.ready) {
        const link = el('input'); link.type = 'text'; link.readOnly = true; link.id = 'join-link'; link.value = joinLink(net.code);
        const copy = btn('Copy link', () => {
          const done = () => { copy.textContent = 'Copied'; setTimeout(() => { copy.textContent = 'Copy link'; }, 1500); };
          try { navigator.clipboard.writeText(link.value).then(done, () => { link.select(); }); } catch (e) { link.select(); }
        });
        const row = el('div', 'link-row'); row.append(link, copy); box.append(row);
      }
      const st = el('p', 'wait'); st.append(net.ready ? 'Waiting for your friend to join' : 'Setting up the game', el('span', 'thinking'));
      st.lastChild.append(el('i'), el('i'), el('i'));
      box.append(st);
      if (friendUi.error) box.append(el('p', 'error', friendUi.error));
      box.append(barWith(btn('Cancel', cancelOnline)));
      return box;
    }
    if (net && net.role === 'guest') {
      const st = el('p', 'wait'); st.append('Connecting to game ' + net.code, el('span', 'thinking')); st.lastChild.append(el('i'), el('i'), el('i'));
      box.append(st, barWith(btn('Cancel', cancelOnline)));
      return box;
    }
    const form = el('div', 'settings');
    const row = (label, control) => { const r = el('label', 'row'); r.append(el('span', null, label), control); form.append(r); };
    const me = el('input'); me.type = 'text'; me.id = 'friend-myname'; me.maxLength = 14; me.placeholder = 'Your name'; me.value = settings.names[0] === 'You' ? '' : settings.names[0];
    row('Your name', me);
    const seat = el('select'); seat.id = 'friend-seat';
    for (const [v, t] of [['2', 'My partner (across the table)'], ['1', 'My opponent (on my right)']]) { const o = el('option', null, t); o.value = v; seat.append(o); }
    row('My friend plays as', seat);
    box.append(form);
    box.append(el('h3', null, 'On this computer'));
    box.append(el('p', null, 'Take turns on one computer. Your cards stay hidden while the other person has it.'));
    const fr = el('input'); fr.type = 'text'; fr.id = 'friend-name'; fr.maxLength = 14; fr.placeholder = 'Friend’s name';
    const lr = el('div', 'link-row'); lr.append(fr, btn('Start pass-and-play', startLocal, 'primary')); box.append(lr);
    box.append(el('h3', null, 'Online, each on your own computer'));
    box.append(el('p', null, 'Start a game and send your friend the code or link, or join with the code your friend sent you.'));
    const hb = el('div', 'link-row'); hb.append(btn('Start an online game', hostOnline, 'primary')); box.append(hb);
    const jc = el('input'); jc.type = 'text'; jc.id = 'join-code'; jc.maxLength = 8; jc.placeholder = 'Game code'; jc.value = friendUi.joinCode || ''; jc.autocapitalize = 'characters';
    const jr = el('div', 'link-row'); jr.append(jc, btn('Join', joinOnline)); box.append(jr);
    if (friendUi.error) box.append(el('p', 'error', friendUi.error));
    box.append(barWith(btn('Close', closeModal)));
    return box;
  }

  // ---------- boot ----------
  function wire() {
    $('#btn-rules').addEventListener('click', () => { modal = 'rules'; render(); });
    $('#btn-friend').addEventListener('click', () => { modal = 'friend'; friendUi.error = ''; renderModal(true); });
    $('#btn-settings').addEventListener('click', () => { modal = 'settings'; confirmReset = false; render(); });
    document.addEventListener('keydown', e => {
      const typing = e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName);
      if ((e.key === 'n' || e.key === 'N') && !typing && !modal && !e.metaKey && !e.ctrlKey && !e.altKey) { skipAhead(); return; }
      if (e.key !== 'Escape') return;
      if (drag && drag.active) { endDrag(true); return; }
      if (modal && modal !== 'time') closeModal();
    });
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragEnd);
    window.addEventListener('pointercancel', onDragEnd);
    window.addEventListener('touchmove', e => { if (drag && drag.active) e.preventDefault(); }, { passive: false });
    window.addEventListener('blur', () => { if (drag && drag.active) endDrag(true); });
  }
  function validGame(x) {
    if (!x || x.version !== 2) return false;
    for (const k of ['balances', 'wins', 'hands', 'secrets', 'purro', 'waiting', 'marker', 'penalty']) if (!Array.isArray(x[k]) || x[k].length !== 4) return false;
    if (['idle', 'draw', 'discard', 'timeOffer', 'over'].indexOf(x.phase) < 0) return false;
    if (x.phase === 'over' && !x.result) return false;
    if (x.phase === 'timeOffer' && !x.timeOffer) return false;
    return Array.isArray(x.stock) && Array.isArray(x.discards) && Array.isArray(x.events) && !!x.seenIds;
  }
  function start(data) {
    const saved = (data && data.g) ? data : load();
    if (saved && saved.settings) {
      settings = Object.assign({}, DEFAULT_SETTINGS, saved.settings, { names: (Array.isArray(saved.settings.names) && saved.settings.names.length === 4 ? saved.settings.names : DEFAULT_SETTINGS.names).slice() });
      if (saved.settings.v !== 2) { settings.speed = 'realistic'; settings.v = 2; }   // older copies ran the other players quickly
      if (PACE[settings.speed] === undefined) settings.speed = 'realistic';
    }
    if (saved && validGame(saved.g)) g = saved.g;
    else g = C.newGame({ names: settings.names, human: 0 });
    const multi = saved && saved.multi;
    if (multi && multi.mode === 'local' && g === saved.g && Array.isArray(g.humans) && g.humans.length > 1) { mode = 'local'; humanNames = multi.humanNames || {}; handHidden = true; }
    else g.humans = [0];
    applyNames(); C.setDifficulty(g, settings.difficulty); g.dealRule = settings.dealRule;
    applyLook();
    if (saved && saved.order && Array.isArray(saved.order.ids) && g === saved.g) {
      handOrder = saved.order.ids.filter(x => typeof x === 'number'); orderHand = saved.order.hand | 0;
      if (saved.order.groups && typeof saved.order.groups === 'object') groupOf = Object.assign({}, saved.order.groups);
      nextGid = Math.max(saved.order.next | 0, 1, ...Object.values(groupOf).map(v => (v | 0) + 1));
    }
    if (data && data.ui) { selIds = Array.isArray(data.ui.selIds) ? data.ui.selIds.slice() : []; pickExtra = data.ui.pickExtra != null ? data.ui.pickExtra : null; modal = data.ui.modal || null; }
    if (g.phase === 'over') resultShown = true;
    try { const j = new URLSearchParams(location.search).get('join'); if (j) { friendUi.joinCode = j.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8); modal = 'friend'; } } catch (e) { /* no query string here */ }
    wire();
    if (!render()) { mode = 'solo'; humanNames = {}; g = C.newGame({ names: settings.names, human: 0 }); applyNames(); C.setDifficulty(g, settings.difficulty); selIds = []; groupOf = {}; pickExtra = null; modal = null; render(); }
    drive();
  }
  // Small handle for automated play-testing (state is read-only from here; actions go through the same code paths as the UI).
  window.cuajoDebug = {
    state: () => g,
    engine: C,
    deal, newGame,
    drawStock: onStock, takeDiscard: onTake, endHand: onEnd,
    discard: id => onDiscard(id), secret: opt => onSecret(opt), pickExtra: id => onCard(id), time: accept => onTime(accept),
    select: id => onCard(id), group: groupSelected, groups: () => Object.assign({}, groupOf), order: () => handOrder.slice(), isDealing: () => dealing,
    setSpeed: v => { settings.speed = v; save(); },
    closeModal, cardEl, skipAhead, waitingOnOthers,
    mode: () => mode, me: () => ME, net: () => net && { role: net.role, code: net.code, ready: net.ready, connected: net.connected, open: !!(net.conn && net.conn.open) },
    startLocal: (friend, seat) => { modal = 'friend'; renderModal(true); $('#friend-name').value = friend || 'Friend'; $('#friend-seat').value = String(seat || 2); startLocal(); },
    reveal: seat => reveal(seat), covered: () => covered(), promptSeat: () => promptSeat, stopFriend,
  };
  const hot = window.claude && window.claude.hot;
  if (hot && hot.snapshot) hot.snapshot(() => ({ g, settings, order: { ids: handOrder, hand: orderHand }, ui: { selIds, pickExtra, modal } }));
  if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
